<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kk的摄影</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e0e0e;
            color: #f0f0f0;
            min-height: 100vh;
            padding-top: 72px;
            scroll-behavior: smooth;
        }
        a { text-decoration: none; color: inherit; }
        img { display: block; width: 100%; height: auto; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #d4a574; border-radius: 6px; }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(14,14,14,0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 0 40px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .navbar .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .navbar .logo span { color: #d4a574; }
        .navbar .logo i { font-size: 22px; color: #d4a574; }
        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: center;
        }
        .nav-cities {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .nav-cities .city-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.12);
            color: #aaa;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .nav-cities .city-btn:hover { border-color: rgba(212,165,116,0.5); color: #fff; }
        .nav-cities .city-btn.active { background: #d4a574; border-color: #d4a574; color: #0e0e0e; }
        .nav-cities .city-btn.all-btn { border-color: rgba(255,255,255,0.2); color: #ccc; }
        .nav-cities .city-btn.all-btn.active { background: #fff; border-color: #fff; color: #0e0e0e; }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 4px 14px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.25s;
            flex-shrink: 0;
        }
        .search-box:focus-within { border-color: #d4a574; background: rgba(255,255,255,0.1); }
        .search-box i { color: #888; font-size: 14px; margin-right: 8px; }
        .search-box input {
            background: transparent;
            border: none;
            color: #eee;
            padding: 8px 0;
            font-size: 14px;
            width: 150px;
            outline: none;
            font-family: inherit;
        }
        .search-box input::placeholder { color: #666; }

        .gallery {
            max-width: 1440px;
            margin: 0 auto;
            padding: 30px 40px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        .photo-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a1a;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.4s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            aspect-ratio: 4/3;
        }
        .photo-card:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 16px 48px rgba(0,0,0,0.7); }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .photo-card:hover img { transform: scale(1.04); }
        .photo-card .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 22px 18px;
            background: linear-gradient(transparent, rgba(0,0,0,0.75) 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: translateY(12px);
            transition: all 0.35s ease;
        }
        .photo-card:hover .card-overlay { opacity: 1; transform: translateY(0); }
        .photo-card .card-overlay .photo-city {
            font-size: 15px;
            color: #d4a574;
            background: rgba(0,0,0,0.6);
            padding: 6px 20px;
            border-radius: 30px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(212,165,116,0.25);
            letter-spacing: 0.5px;
        }

        .photo-card.highlight {
            animation: highlightPulse 1.2s ease 3;
            z-index: 10;
            box-shadow: 0 0 0 4px #d4a574, 0 12px 48px rgba(212,165,116,0.25);
        }
        @keyframes highlightPulse {
            0%,100% { box-shadow: 0 0 0 4px #d4a574, 0 12px 48px rgba(212,165,116,0.25); transform: scale(1); }
            50% { box-shadow: 0 0 0 10px rgba(212,165,116,0.3), 0 12px 60px rgba(212,165,116,0.4); transform: scale(1.02); }
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #666;
            font-size: 18px;
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; color: #333; }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            position: relative;
            max-width: 900px;
            width: 100%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: modalIn 0.45s cubic-bezier(0.22,1,0.36,1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.92) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-close {
            position: absolute;
            top: -48px;
            right: 0;
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            font-size: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: rgba(255,255,255,0.18); }
        .modal-image-wrap {
            width: 100%;
            background: #111;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0,0,0,0.8);
            position: relative;
        }
        .modal-image-wrap img {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            background: #0a0a0a;
        }

        .modal-footer {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 6px 6px 6px;
            color: #ccc;
            flex-wrap: wrap;
            gap: 12px;
        }
        .modal-footer .photo-info { display: flex; flex-direction: column; gap: 2px; }
        .modal-footer .photo-info .modal-city { font-size: 18px; font-weight: 500; color: #d4a574; letter-spacing: 0.5px; }
        .modal-footer .photo-info .modal-country { font-size: 14px; color: #888; }
        .modal-footer .actions { display: flex; align-items: center; gap: 16px; }
        .modal-footer .actions .printer-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e0e0e0;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .modal-footer .actions .printer-btn i { font-size: 20px; }
        .modal-footer .actions .printer-btn:hover { background: rgba(212,165,116,0.15); border-color: #d4a574; color: #d4a574; transform: scale(1.04); }
        .modal-footer .actions .printer-btn.active { background: rgba(212,165,116,0.2); border-color: #d4a574; color: #d4a574; }

        .polaroid-container {
            display: none;
            margin-top: 20px;
            animation: polaroidAppear 0.5s cubic-bezier(0.22,1,0.36,1);
            width: 100%;
            justify-content: center;
        }
        .polaroid-container.show { display: flex; }
        @keyframes polaroidAppear {
            from { opacity: 0; transform: scale(0.9) rotate(-2deg); }
            to { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .polaroid-frame {
            background: #f5f2ed;
            padding: 20px 20px 56px 20px;
            border-radius: 6px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 4px 16px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            transition: all 0.3s ease;
            transform: rotate(0.6deg);
        }
        .polaroid-frame .polaroid-image {
            width: 100%;
            aspect-ratio: 1/1;
            overflow: hidden;
            border-radius: 2px;
            background: #111;
        }
        .polaroid-frame .polaroid-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .polaroid-frame .polaroid-caption {
            text-align: center;
            margin-top: 14px;
            font-family: 'Courier New', Georgia, serif;
            font-size: 15px;
            color: #2d2d2d;
            letter-spacing: 0.5px;
            line-height: 1.6;
            font-weight: 400;
        }
        .polaroid-frame .polaroid-caption .p-city { font-weight: 600; font-size: 17px; color: #2d2d2d; }
        .polaroid-frame .polaroid-caption .p-country { color: #8a7a6a; font-size: 13px; }
        .polaroid-frame .polaroid-caption .p-date { color: #aaa; font-size: 11px; margin-top: 2px; font-style: italic; }
        .polaroid-close-btn {
            margin-top: 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            color: #999;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .polaroid-close-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

        .footer {
            text-align: center;
            padding: 40px 20px 30px;
            color: #444;
            font-size: 13px;
            border-top: 1px solid rgba(255,255,255,0.04);
            letter-spacing: 0.3px;
        }
        .footer span { color: #d4a574; }

        .admin-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 3000;
            background: rgba(212,165,116,0.9);
            color: #0e0e0e;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(212,165,116,0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-toggle:hover { transform: scale(1.08); background: #d4a574; box-shadow: 0 12px 40px rgba(212,165,116,0.6); }

        .admin-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 560px;
            height: 100vh;
            background: #141414;
            z-index: 4000;
            padding: 24px 24px 30px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.22,1,0.36,1);
            box-shadow: -8px 0 48px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .admin-panel.open { right: 0; }
        .admin-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .admin-panel .panel-header h2 { font-size: 22px; font-weight: 500; color: #fff; }
        .admin-panel .panel-header h2 i { color: #d4a574; margin-right: 8px; }
        .admin-panel .panel-close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .admin-panel .panel-close:hover { color: #fff; }

        .admin-auth {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
            padding: 30px 0;
        }
        .admin-auth .auth-icon { font-size: 48px; color: #d4a574; }
        .admin-auth .auth-title { font-size: 18px; color: #ddd; }
        .admin-auth .auth-input-group {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .admin-auth .auth-input-group input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #0e0e0e;
            color: #f0f0f0;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            min-width: 180px;
        }
        .admin-auth .auth-input-group input:focus { border-color: #d4a574; }
        .admin-auth .auth-input-group button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: #d4a574;
            color: #0e0e0e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s;
            font-family: inherit;
        }
        .admin-auth .auth-input-group button:hover { background: #e0b88a; }
        .admin-auth .auth-error { color: #e05a5a; font-size: 14px; min-height: 20px; }

        .admin-content { display: none; flex-direction: column; gap: 16px; flex: 1; }
        .admin-content.visible { display: flex; }

        .admin-panel .photo-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
            max-height: 300px;
        }
        .admin-panel .photo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1e1e1e;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s;
        }
        .admin-panel .photo-item:hover { background: #262626; }
        .admin-panel .photo-item .thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #111;
            flex-shrink: 0;
        }
        .admin-panel .photo-item .info { flex: 1; min-width: 0; }
        .admin-panel .photo-item .info .item-label { font-weight: 500; font-size: 14px; color: #eee; }
        .admin-panel .photo-item .info .item-city { font-size: 13px; color: #d4a574; }
        .admin-panel .photo-item .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .admin-panel .photo-item .actions button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: #aaa;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .admin-panel .photo-item .actions .edit-btn:hover { border-color: #d4a574; color: #d4a574; background: rgba(212,165,116,0.08); }
        .admin-panel .photo-item .actions .del-btn:hover { border-color: #e05a5a; color: #e05a5a; background: rgba(224,90,90,0.08); }

        .category-section {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 14px;
            flex-shrink: 0;
        }
        .category-section h3 { font-size: 14px; font-weight: 500; color: #aaa; margin-bottom: 10px; }
        .category-section .cat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .category-section .cat-item .cat-name { color: #ddd; font-size: 14px; }
        .category-section .cat-item .cat-count { color: #888; font-size: 12px; margin-left: 8px; }
        .category-section .cat-item .del-cat-btn {
            background: transparent;
            border: none;
            color: #e05a5a;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 12px;
            transition: all 0.2s;
        }
        .category-section .cat-item .del-cat-btn:hover { background: rgba(224,90,90,0.15); color: #ff7a7a; }
        .category-section .add-cat-form {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .category-section .add-cat-form input,
        .category-section .add-cat-form select {
            background: #0e0e0e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 14px;
            color: #f0f0f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            flex: 1;
            min-width: 100px;
        }
        .category-section .add-cat-form input:focus,
        .category-section .add-cat-form select:focus { border-color: #d4a574; }
        .category-section .add-cat-form button {
            background: rgba(212,165,116,0.15);
            border: 1px solid rgba(212,165,116,0.2);
            color: #d4a574;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            white-space: nowrap;
        }
        .category-section .add-cat-form button:hover { background: rgba(212,165,116,0.25); border-color: #d4a574; }

        .admin-panel .panel-footer {
            flex-shrink: 0;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-panel .panel-footer button {
            background: rgba(212,165,116,0.12);
            border: 1px solid rgba(212,165,116,0.2);
            color: #d4a574;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .admin-panel .panel-footer button:hover { background: rgba(212,165,116,0.2); border-color: #d4a574; }
        .admin-panel .panel-footer button.danger {
            background: rgba(224,90,90,0.1);
            border-color: rgba(224,90,90,0.2);
            color: #e05a5a;
        }
        .admin-panel .panel-footer button.danger:hover { background: rgba(224,90,90,0.18); }

        .admin-panel .edit-form {
            background: #1a1a1a;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            display: none;
            flex-direction: column;
            gap: 14px;
            flex-shrink: 0;
        }
        .admin-panel .edit-form.show { display: flex; }
        .admin-panel .edit-form .form-row { display: flex; flex-direction: column; gap: 4px; }
        .admin-panel .edit-form .form-row label { font-size: 13px; color: #aaa; font-weight: 500; }
        .admin-panel .edit-form .form-row input,
        .admin-panel .edit-form .form-row select {
            background: #0e0e0e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f0f0f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .admin-panel .edit-form .form-row input:focus,
        .admin-panel .edit-form .form-row select:focus { border-color: #d4a574; }
        .admin-panel .edit-form .form-row input[type="file"] { padding: 8px; background: transparent; }
        .admin-panel .edit-form .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .admin-panel .edit-form .form-actions button {
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .admin-panel .edit-form .form-actions .save-btn { background: #d4a574; color: #0e0e0e; }
        .admin-panel .edit-form .form-actions .save-btn:hover { background: #e0b88a; }
        .admin-panel .edit-form .form-actions .cancel-btn { background: rgba(255,255,255,0.06); color: #aaa; }
        .admin-panel .edit-form .form-actions .cancel-btn:hover { background: rgba(255,255,255,0.12); }

        .save-status {
            font-size: 13px;
            color: #888;
            padding: 4px 0;
            text-align: center;
        }
        .save-status.saving { color: #d4a574; }
        .save-status.saved { color: #6fcf97; }
        .save-status.error { color: #e05a5a; }

        @media (max-width: 900px) {
            .navbar { padding: 0 20px; height: 64px; flex-wrap: wrap; gap: 6px; }
            body { padding-top: 64px; }
            .navbar .logo { font-size: 20px; }
            .nav-center { flex-wrap: wrap; justify-content: flex-start; gap: 6px; }

        // ================================================================

        // 读取数据
        async function loadFromCloud() {
            try {
                const response = await fetch(DATABASE_URL, {
                    headers: {
                        'x-apikey': API_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) throw new Error('读取失败');
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    const photos = data.map(record => ({
                        id: record._id || record.id || Math.random().toString(36).substr(2, 9),
                        country: record.country || '',
                        city: record.city || '',
                        image: record.image || ''
                    }));
                    const valid = photos.filter(p => p.country && p.city && p.image);
                    if (valid.length > 0) return valid;
                }
                // 云端无数据，写入默认
                await saveToCloud(DEFAULT_PHOTOS);
                return DEFAULT_PHOTOS.slice();
            } catch (error) {
                console.warn('云端加载失败，使用本地缓存或默认数据', error);
                const cached = localStorage.getItem('kk_cloud_cache');
                if (cached) {
                    try { return JSON.parse(cached); } catch(e) {}
                }
                return DEFAULT_PHOTOS.slice();
            }
        }

        // 保存数据到云端（优化版：批量插入）
        async function saveToCloud(photos) {
            const statusEl = document.getElementById('saveStatus');
            if (statusEl) {
                statusEl.textContent = '⏳ 正在保存到云端...';
                statusEl.className = 'save-status saving';
            }

            try {
                // 1. 先清空所有现有记录
                const listResponse = await fetch(DATABASE_URL, {
                    headers: {
                        'x-apikey': API_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                if (listResponse.ok) {
                    const existing = await listResponse.json();
                    if (Array.isArray(existing) && existing.length > 0) {
                        // 并行删除所有记录
                        const deletePromises = existing.map(record =>
                            fetch(`${DATABASE_URL}/${record._id}`, {
                                method: 'DELETE',
                                headers: { 'x-apikey': API_KEY }
                            })
                        );
                        await Promise.all(deletePromises);
                        // 等待一下让删除生效
                        await new Promise(resolve => setTimeout(resolve, 500));
                    }
                }

                // 2. 批量插入新数据（每次最多10条）
                const records = photos.map(p => ({
                    country: p.country,
                    city: p.city,
                    image: p.image
                }));

                const batchSize = 10;
                for (let i = 0; i < records.length; i += batchSize) {
                    const batch = records.slice(i, i + batchSize);
                    const response = await fetch(DATABASE_URL, {
                        method: 'POST',
                        headers: {
                            'x-apikey': API_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(batch)  // 传递数组
                    });
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`批量插入失败：${response.status} ${errorText}`);
                    }
                    // 等待避免触发频率限制
                    await new Promise(resolve => setTimeout(resolve, 300));
                }

                localStorage.setItem('kk_cloud_cache', JSON.stringify(photos));
                if (statusEl) {
                    statusEl.textContent = '✅ 已同步到云端';
                    statusEl.className = 'save-status saved';
                }
                return true;
            } catch (error) {
                console.error('保存到云端失败', error);
                if (statusEl) {
                    statusEl.textContent = '❌ 保存失败，请检查网络或密钥';
                    statusEl.className = 'save-status error';
                }
                // 抛出错误，让上层处理
                throw error;
            }
        }

        // ================================================================
        //  数据缓存（在内存中）
        // ================================================================
        let photos = [];

        async function initData() {
            try {
                photos = await loadFromCloud();
            } catch (e) {
                // 如果加载失败，使用默认数据
                photos = DEFAULT_PHOTOS.slice();

                    await saveToCloud(photos);

                    console.warn('初次写入默认数据失败', err);
                }
            }
            syncCategories();
            renderAll();
            window._highlighted = false;
            setTimeout(() => {
                window._highlighted = false;
                randomHighlightAndScroll();
            }, 500);
        }

        function getCountries() {
            const set = new Set();
            photos.forEach(p => set.add(p.country));
            return Array.from(set).sort();
        }

        function getCities() {
            const set = new Set();
            photos.forEach(p => set.add(p.city));
            return Array.from(set).sort();
        }

        function getCitiesByCountry(country) {
            const set = new Set();
            photos.filter(p => p.country === country).forEach(p => set.add(p.city));
            return Array.from(set).sort();
        }

        function syncCategories() {
            const countries = getCountries();
            localStorage.setItem('kk_countries', JSON.stringify(countries));
            const citySet = new Set();
            photos.forEach(p => citySet.add(JSON.stringify({ country: p.country, city: p.city })));
            const cityList = Array.from(citySet).map(s => JSON.parse(s));
            localStorage.setItem('kk_cities', JSON.stringify(cityList));
        }

        function loadCountries() {
            const stored = localStorage.getItem('kk_countries');
            if (stored) {
                try { return JSON.parse(stored); } catch(e) {}
            }
            return getCountries();
        }

        function loadCities() {
            const stored = localStorage.getItem('kk_cities');
            if (stored) {
                try { return JSON.parse(stored); } catch(e) {}
            }
            return photos.map(p => ({ country: p.country, city: p.city }));
        }

        // ---- 操作函数 ----
        function addPhoto(country, city, imageData) {
            const newId = photos.length ? Math.max(...photos.map(p => p.id)) + 1 : 1;
            photos.push({ id: newId, country: country.trim(), city: city.trim(), image: imageData });
            saveAndRefresh();
        }

        function updatePhoto(id, country, city, imageData) {
            const idx = photos.findIndex(p => p.id === id);
            if (idx === -1) return;
            const updated = { ...photos[idx] };
            if (country) updated.country = country.trim();
            if (city) updated.city = city.trim();
            if (imageData) updated.image = imageData;
            photos[idx] = updated;
            saveAndRefresh();
        }

            saveAndRefresh();

        function renderGalleryView(city, searchTerm = '') {
            let filtered = city === 'all' ? photos : photos.filter(p => p.city === city);
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(p =>
                    p.city.toLowerCase().includes(term) ||
                    p.country.toLowerCase().includes(term)
                );
            }

            if (filtered.length === 0) {

                    <div class="empty-state">

                return;
            }

            let html = '';
            filtered.forEach(p => {
                html += `
                    <div class="photo-card" data-id="${p.id}" data-city="${p.city}">

                    openModal(id);

        function randomHighlightAndScroll() {
            const cards = document.querySelectorAll('.photo-card');
            if (cards.length === 0) return;
            cards.forEach(c => c.classList.remove('highlight'));
            const idx = Math.floor(Math.random() * cards.length);
            const target = cards[idx];
            if (!target) return;
            target.classList.add('highlight');
            const rect = target.getBoundingClientRect();
            const offset = rect.top + window.pageYOffset - 120;
            window.scrollTo({ top: offset, behavior: 'smooth' });
            setTimeout(() => target.classList.remove('highlight'), 3800);
        }

        function renderCityButtons() {
            const cities = getCities();
            const allBtn = cityFilter.querySelector('.all-btn');
            if (!allBtn) return;
            cityFilter.querySelectorAll('.city-btn:not(.all-btn)').forEach(btn => btn.remove());

            cities.forEach(city => {
                const btn = document.createElement('button');
                btn.className = 'city-btn';
                btn.dataset.city = city;
                btn.textContent = city;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = city;
                    renderGalleryView(city, searchInput.value.trim());
                });
                cityFilter.appendChild(btn);
            });

            const newAllBtn = allBtn.cloneNode(true);
            allBtn.parentNode.replaceChild(newAllBtn, allBtn);
            newAllBtn.addEventListener('click', function() {
                document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = 'all';
                renderGalleryView('all', searchInput.value.trim());
            });
            document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
            const targetBtn = document.querySelector(`.city-btn[data-city="${currentFilter}"]`) || newAllBtn;
            targetBtn.classList.add('active');
        }

        function openModal(id) {
            const photo = photos.find(p => p.id === id);
            if (!photo) return;
            currentPhotoId = id;
            isPolaroidOpen = false;

            modalImage.src = photo.image;
            modalImage.alt = photo.city;
            modalCity.textContent = photo.city;
            modalCountry.textContent = '📍 ' + photo.country;

            polaroidContainer.classList.remove('show');
            polaroidContainer.style.display = 'none';
            printerBtn.classList.remove('active');

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
            polaroidContainer.classList.remove('show');
            polaroidContainer.style.display = 'none';
            printerBtn.classList.remove('active');
            isPolaroidOpen = false;
        }

        function togglePolaroid() {
            if (!currentPhotoId) return;
            const photo = photos.find(p => p.id === currentPhotoId);
            if (!photo) return;

            if (isPolaroidOpen) {
                polaroidContainer.classList.remove('show');
                polaroidContainer.style.display = 'none';
                printerBtn.classList.remove('active');
                isPolaroidOpen = false;
                return;
            }

            polaroidImg.src = photo.image;
            polaroidImg.alt = photo.city;
            polaroidCity.textContent = photo.city;
            polaroidCountry.textContent = photo.country;

            polaroidContainer.style.display = 'flex';
            requestAnimationFrame(() => polaroidContainer.classList.add('show'));
            printerBtn.classList.add('active');
            isPolaroidOpen = true;
        }

        function renderAdminData() {
            if (!isAuthorized) return;
            renderAdminList();
            renderCountryAdminList();
            renderCityAdminList();
            populateFormSelects('', '');
            populateCountrySelect();
            closeEditForm();
        }

        function renderAdminList() {
            if (photos.length === 0) {
                adminPhotoList.innerHTML = `<div style="color:#666;text-align:center;padding:30px;">暂无照片，点击 "添加照片" 上传</div>`;
                return;
            }
            let html = '';
            photos.forEach((p, idx) => {
                html += `
                    <div class="photo-item" data-id="${p.id}">
                        <img class="thumb" src="${p.image}" alt="${p.city}" />
                        <div class="info">
                            <div class="item-label">#${idx+1} · ${p.country}</div>
                            <div class="item-city">${p.city}</div>
                        </div>
                        <div class="actions">
                            <button class="edit-btn" data-id="${p.id}">✏️ 编辑</button>
                            <button class="del-btn" data-id="${p.id}">🗑️ 删除</button>
                        </div>
                    </div>
                `;
            });
            adminPhotoList.innerHTML = html;

            adminPhotoList.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    openEditForm(id);
                });
            });
            adminPhotoList.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    if (confirm('确定删除这张照片吗？')) deletePhoto(id);
                });
            });
        }

        function renderCountryAdminList() {
            const countries = getCountries();
            if (countries.length === 0) {
                countryListAdmin.innerHTML = `<div style="color:#666;font-size:13px;padding:4px 0;">暂无国家</div>`;
                return;
            }
            let html = '';
            countries.forEach(country => {
                const count = photos.filter(p => p.country === country).length;
                html += `
                    <div class="cat-item">
                        <span><span class="cat-name">${country}</span> <span class="cat-count">（${count} 张）</span></span>
                        <button class="del-cat-btn" data-country="${country}">删除</button>
                    </div>
                `;
            });
            countryListAdmin.innerHTML = html;
            countryListAdmin.querySelectorAll('.del-cat-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const country = this.dataset.country;
                    const count = photos.filter(p => p.country === country).length;
                    if (confirm(`确定删除国家“${country}”及其所有照片（共 ${count} 张）吗？此操作不可撤销！`)) {
                        deleteCountry(country);
                    }
                });
            });
            populateCountrySelect();
        }

        function renderCityAdminList() {
            const cities = photos.map(p => ({ country: p.country, city: p.city }));
            const citySet = new Set();
            cities.forEach(c => citySet.add(JSON.stringify(c)));
            const cityList = Array.from(citySet).map(s => JSON.parse(s));
            if (cityList.length === 0) {
                cityListAdmin.innerHTML = `<div style="color:#666;font-size:13px;padding:4px 0;">暂无城市</div>`;
                return;
            }
            let html = '';
            const countries = getCountries();
            countries.forEach(country => {
                const citiesInCountry = cityList.filter(c => c.country === country);
                if (citiesInCountry.length === 0) return;
                html += `<div style="margin-top:4px;color:#888;font-size:12px;">${country}</div>`;
                citiesInCountry.forEach(c => {
                    const count = photos.filter(p => p.country === country && p.city === c.city).length;
                    html += `
                        <div class="cat-item" style="padding-left:16px;">
                            <span><span class="cat-name">${c.city}</span> <span class="cat-count">（${count} 张）</span></span>
                            <button class="del-cat-btn" data-country="${country}" data-city="${c.city}">删除</button>
                        </div>
                    `;
                });
            });
            cityListAdmin.innerHTML = html;
            cityListAdmin.querySelectorAll('.del-cat-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const country = this.dataset.country;
                    const city = this.dataset.city;
                    const count = photos.filter(p => p.country === country && p.city === city).length;
                    if (confirm(`确定删除城市“${city}”（${country}）及其所有照片（共 ${count} 张）吗？此操作不可撤销！`)) {
                        deleteCity(country, city);
                    }
                });
            });
        }

        function populateFormSelects(selectedCountry, selectedCity) {
            const countries = getCountries();
            formCountry.innerHTML = `<option value="">— 选择国家 —</option>`;
            countries.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                if (c === selectedCountry) opt.selected = true;
                formCountry.appendChild(opt);
            });
            populateCitySelect(selectedCountry, selectedCity);
        }

        function populateCitySelect(country, selectedCity) {
            formCity.innerHTML = `<option value="">— 请先选择国家 —</option>`;
            if (!country) return;
            const cities = getCitiesByCountry(country);
            cities.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                if (c === selectedCity) opt.selected = true;
                formCity.appendChild(opt);
            });
        }

        function populateCountrySelect() {
            const countries = getCountries();
            const currentVal = cityCountrySelect.value;
            cityCountrySelect.innerHTML = `<option value="">— 选择国家 —</option>`;
            countries.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                cityCountrySelect.appendChild(opt);
            });
            if (currentVal && countries.includes(currentVal)) {
                cityCountrySelect.value = currentVal;
            }
        }

        let editingId = null;

        function openEditForm(id) {
            if (!isAuthorized) return;
            editingId = id;
            const photo = photos.find(p => p.id === id);
            if (!photo) return;
            formFile.value = '';
            populateFormSelects(photo.country, photo.city);
            editForm.classList.add('show');
            editForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function closeEditForm() {
            editForm.classList.remove('show');
            editingId = null;
            formFile.value = '';
            formCountry.value = '';
            formCity.innerHTML = `<option value="">— 请先选择国家 —</option>`;
        }

        function saveForm() {
            if (!isAuthorized) return;
            const country = formCountry.value;
            const city = formCity.value;
            if (!country || !city) {
                alert('国家和城市都不能为空');
                return;
            }

            const file = formFile.files[0];
            if (file) {
                compressImage(file, 800, 0.8, (base64) => {
                    if (editingId) {
                        updatePhoto(editingId, country, city, base64);
                    } else {
                        addPhoto(country, city, base64);
                    }
                    closeEditForm();
                });
            } else {
                if (editingId) {
                    updatePhoto(editingId, country, city, null);
                } else {
                    alert('请选择一张照片');
                    return;
                }
                closeEditForm();
            }
        }

        function compressImage(file, maxW, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width,
                        h = img.height;
                    if (w > maxW) {
                        const ratio = maxW / w;
                        w = maxW;
                        h = h * ratio;
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function addCountryHandler() {
            if (!isAuthorized) return;
            const name = newCountryInput.value.trim();
            if (!name) return alert('请输入国家名称');
            if (getCountries().includes(name)) return alert('国家已存在');
            alert(`国家“${name}”已在系统中，你可以通过添加照片来使用它。`);
            newCountryInput.value = '';
            populateCountrySelect();
            renderCountryAdminList();
        }

        function addCityHandler() {
            if (!isAuthorized) return;
            const country = cityCountrySelect.value;
            const cityName = newCityInput.value.trim();
            if (!country) return alert('请选择国家');
            if (!cityName) return alert('请输入城市名称');
            if (photos.some(p => p.country === country && p.city === cityName)) {
                return alert('该城市已存在');
            }
            alert(`城市“${cityName}”（${country}）已添加，你可以通过添加照片来使用它。`);
            newCityInput.value = '';
            renderCityAdminList();
            populateFormSelects(country, cityName);
        }

        function renderAll() {
            renderCityButtons();
            renderGalleryView(currentFilter, searchInput.value.trim());
            if (isAuthorized) {
                renderAdminData();
            }
        }

        // ================================================================
        //  事件绑定
        // ================================================================
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (modalOverlay.classList.contains('active')) closeModal();
                if (adminPanel.classList.contains('open')) closeAdminPanel();
            }
        });
        printerBtn.addEventListener('click', togglePolaroid);
        polaroidCloseBtn.addEventListener('click', function() {
            polaroidContainer.classList.remove('show');
            polaroidContainer.style.display = 'none';
            printerBtn.classList.remove('active');
            isPolaroidOpen = false;
        });

        adminToggle.addEventListener('click', function() {
            adminPanel.classList.toggle('open');
            if (adminPanel.classList.contains('open')) {
                showAuth();
            } else {
                closeAdminPanel();
            }
        });

        adminClose.addEventListener('click', closeAdminPanel);

        function closeAdminPanel() {
            adminPanel.classList.remove('open');
            isAuthorized = false;
            adminContent.classList.remove('visible');
            adminAuth.style.display = 'flex';
            authPassword.value = '';
            authError.textContent = '';
            closeEditForm();
        }

        addPhotoBtn.addEventListener('click', function() {
            if (!isAuthorized) return;
            editingId = null;
            formFile.value = '';
            populateFormSelects('', '');
            editForm.classList.add('show');
        });

        formCancelBtn.addEventListener('click', closeEditForm);
        formSaveBtn.addEventListener('click', saveForm);
        resetDefaultBtn.addEventListener('click', resetToDefault);

        addCountryBtn.addEventListener('click', addCountryHandler);
        newCountryInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addCountryHandler(); });

        addCityBtn.addEventListener('click', addCityHandler);
        newCityInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addCityHandler(); });

        formCountry.addEventListener('change', function() {
            const country = this.value;
            populateCitySelect(country, '');
        });

        searchInput.addEventListener('input', function() {
            const term = this.value.trim();
            renderGalleryView(currentFilter, term);
        });

        // ================================================================
        //  启动
        // ================================================================
        async function init() {
            await initData();
            showAuth();
            console.log('✨ kk的摄影 已加载 (RestDB 同步)');
            console.log('📸 照片总数:', photos.length);
            console.log('🏛️ 国家:', getCountries().join(', '));
            console.log('🔒 管理密码: kst2142600396');
        }

        init();
    </script>
