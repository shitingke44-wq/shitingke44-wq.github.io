<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kk's Photography</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== 全局重置 & 基础 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            padding-top: 72px;
        }
        a { text-decoration: none; color: inherit; }
        img { display: block; width: 100%; height: auto; }

        /* ========== 导航栏 ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 0 40px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .navbar .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #1a1a1a;
        }
        .navbar .logo span { color: #d4a574; }
        .navbar .nav-links {
            display: flex;
            gap: 32px;
            font-size: 16px;
            font-weight: 500;
        }
        .navbar .nav-links a {
            color: #555;
            transition: color 0.2s;
            cursor: pointer;
        }
        .navbar .nav-links a:hover,
        .navbar .nav-links a.active {
            color: #1a1a1a;
        }
        .navbar .nav-links a.active {
            border-bottom: 2px solid #d4a574;
            padding-bottom: 4px;
        }
        .admin-toggle {
            background: none;
            border: none;
            font-size: 20px;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
            padding: 8px;
        }
        .admin-toggle:hover { color: #1a1a1a; }

        /* ========== 页面容器 ========== */
        .page {
            display: none;
            padding: 40px 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .page.active { display: block; }

        /* ========== 首页（HOME） ========== */
        .home-hero {
            text-align: center;
            padding: 60px 0 40px;
        }
        .home-hero h1 {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #1a1a1a;
        }
        .home-hero h1 span { color: #d4a574; font-weight: 600; }
        .home-hero .sub {
            font-size: 18px;
            color: #888;
            margin-top: 12px;
        }
        .home-hero .enter-btn {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 48px;
            border: 1px solid #1a1a1a;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            background: transparent;
            cursor: pointer;
            transition: all 0.25s;
        }
        .home-hero .enter-btn:hover {
            background: #1a1a1a;
            color: #fff;
        }

        /* ---- 轮播 ---- */
        .carousel {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 40px auto 0;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #f5f5f5;
        }
        .carousel .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
        }
        .carousel .slide {
            flex: 0 0 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .carousel .dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        .carousel .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: background 0.3s;
        }
        .carousel .dots span.active {
            background: #fff;
        }

        /* ========== 作品页（WORKS） ========== */
        .works-header {
            margin-bottom: 32px;
        }
        .works-header h2 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .filter-section {
            margin: 20px 0 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filter-section .filter-label {
            font-size: 14px;
            color: #888;
            margin-right: 8px;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .filter-btn:hover {
            border-color: #999;
            color: #1a1a1a;
        }
        .filter-btn.active {
            background: #1a1a1a;
            border-color: #1a1a1a;
            color: #fff;
        }
        .filter-btn.city-btn {
            background: #f0f0f0;
            border-color: #e0e0e0;
        }
        .filter-btn.city-btn.active {
            background: #d4a574;
            border-color: #d4a574;
            color: #fff;
        }
        .filter-back {
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 12px;
            font-family: inherit;
        }
        .filter-back:hover { color: #1a1a1a; }

        /* 照片网格（两列） */
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }
        .photo-grid .grid-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #f5f5f5;
            aspect-ratio: 4 / 3;
            cursor: pointer;
            transition: transform 0.25s ease;
        }
        .photo-grid .grid-item:hover {
            transform: scale(1.01);
        }
        .photo-grid .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-grid .grid-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 18px;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            color: #fff;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .photo-grid .grid-item:hover .overlay {
            opacity: 1;
        }
        .photo-grid .grid-item .overlay .title {
            font-size: 16px;
            font-weight: 500;
        }
        .photo-grid .grid-item .overlay .city {
            font-size: 13px;
            opacity: 0.8;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
            font-size: 18px;
        }

        /* ========== 模态框（照片详情） ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            position: relative;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(0,0,0,0.7); }
        .modal-image-wrap {
            width: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-image-wrap img {
            width: 100%;
            max-height: 65vh;
            object-fit: contain;
            display: block;
        }
        .modal-footer {
            padding: 20px 28px 24px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .modal-footer .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .modal-footer .info .title {
            font-size: 20px;
            font-weight: 500;
            color: #1a1a1a;
        }
        .modal-footer .info .city {
            font-size: 14px;
            color: #888;
        }
        .modal-footer .info .location {
            font-size: 14px;
            color: #d4a574;
            font-weight: 500;
        }
        .modal-footer .actions {
            display: flex;
            gap: 12px;
        }
        .modal-footer .actions .printer-btn {
            background: #f0f0f0;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .modal-footer .actions .printer-btn:hover {
            background: #e0e0e0;
        }

        /* ========== 拍立得全屏覆盖 ========== */
        .polaroid-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .polaroid-fullscreen.active { display: flex; }
        .polaroid-fullscreen .polaroid-frame {
            background: #f5f2ed;
            padding: 30px 30px 70px 30px;
            border-radius: 8px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            max-width: 600px;
            width: 100%;
            transform: rotate(0.8deg);
            animation: polaroidIn 0.5s ease;
        }
        @keyframes polaroidIn {
            from { opacity: 0; transform: scale(0.9) rotate(-3deg); }
            to { opacity: 1; transform: scale(1) rotate(0.8deg); }
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 4px;
            background: #111;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption {
            text-align: center;
            margin-top: 18px;
            font-family: 'Courier New', Georgia, serif;
            font-size: 17px;
            color: #2d2d2d;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption .p-title {
            font-weight: 600;
            font-size: 20px;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption .p-city {
            color: #8a7a6a;
            font-size: 15px;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption .p-location {
            color: #aaa;
            font-size: 13px;
            margin-top: 4px;
            font-style: italic;
        }
        .polaroid-fullscreen .polaroid-close {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .polaroid-fullscreen .polaroid-close:hover {
            background: rgba(255,255,255,0.2);
        }

        /* ========== About 页 ========== */
        .about-content {
            max-width: 720px;
            margin: 40px auto;
            text-align: center;
            font-size: 18px;
            line-height: 1.8;
            color: #444;
        }
        .about-content h2 {
            font-weight: 300;
            font-size: 32px;
            margin-bottom: 20px;
        }

        /* ========== 管理面板（保留原有） ========== */
        .admin-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 560px;
            height: 100vh;
            background: #141414;
            z-index: 4000;
            padding: 24px 24px 30px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.22,1,0.36,1);
            box-shadow: -8px 0 48px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
            color: #eee;
        }
        .admin-panel.open { right: 0; }
        .admin-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .admin-panel .panel-header h2 { font-size: 22px; font-weight: 500; color: #fff; }
        .admin-panel .panel-header h2 i { color: #d4a574; margin-right: 8px; }
        .admin-panel .panel-close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }
        .admin-panel .panel-close:hover { color: #fff; }
        .admin-panel .admin-auth {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
        }
        .admin-panel .admin-auth .auth-icon { font-size: 48px; color: #d4a574; }
        .admin-panel .admin-auth .auth-title { font-size: 18px; color: #ddd; }
        .admin-panel .admin-auth .auth-input-group {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .admin-panel .admin-auth .auth-input-group input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #0e0e0e;
            color: #f0f0f0;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            min-width: 180px;
        }
        .admin-panel .admin-auth .auth-input-group input:focus { border-color: #d4a574; }
        .admin-panel .admin-auth .auth-input-group button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: #d4a574;
            color: #0e0e0e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .admin-panel .admin-auth .auth-error { color: #e05a5a; font-size: 14px; min-height: 20px; }
        .admin-panel .admin-content { display: none; flex-direction: column; gap: 16px; flex: 1; }
        .admin-panel .admin-content.visible { display: flex; }
        .admin-panel .sync-status {
            font-size: 13px;
            color: #6fcf97;
            padding: 4px 0;
            text-align: center;
        }
        .admin-panel .edit-form {
            background: #1a1a1a;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            display: none;
            flex-direction: column;
            gap: 14px;
            flex-shrink: 0;
        }
        .admin-panel .edit-form.show { display: flex; }
        .admin-panel .edit-form .form-row { display: flex; flex-direction: column; gap: 4px; }
        .admin-panel .edit-form .form-row label { font-size: 13px; color: #aaa; font-weight: 500; }
        .admin-panel .edit-form .form-row input,
        .admin-panel .edit-form .form-row select {
            background: #0e0e0e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f0f0f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .admin-panel .edit-form .form-row input:focus,
        .admin-panel .edit-form .form-row select:focus { border-color: #d4a574; }
        .admin-panel .edit-form .form-row input[type="file"] { padding: 8px; background: transparent; }
        .admin-panel .edit-form .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .admin-panel .edit-form .form-actions button {
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .admin-panel .edit-form .form-actions .save-btn { background: #d4a574; color: #0e0e0e; }
        .admin-panel .edit-form .form-actions .save-btn:hover { background: #e0b88a; }
        .admin-panel .edit-form .form-actions .cancel-btn { background: rgba(255,255,255,0.06); color: #aaa; }
        .admin-panel .edit-form .form-actions .cancel-btn:hover { background: rgba(255,255,255,0.12); }

        .admin-panel .photo-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
            max-height: 300px;
        }
        .admin-panel .photo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1e1e1e;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .admin-panel .photo-item .thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #111;
            flex-shrink: 0;
        }
        .admin-panel .photo-item .info { flex: 1; min-width: 0; }
        .admin-panel .photo-item .info .item-title { font-weight: 500; font-size: 15px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-panel .photo-item .info .item-city { font-size: 13px; color: #d4a574; }
        .admin-panel .photo-item .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .admin-panel .photo-item .actions button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: #aaa;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .admin-panel .photo-item .actions .edit-btn:hover { border-color: #d4a574; color: #d4a574; background: rgba(212,165,116,0.08); }
        .admin-panel .photo-item .actions .del-btn:hover { border-color: #e05a5a; color: #e05a5a; background: rgba(224,90,90,0.08); }

        .admin-panel .category-section {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 14px;
            flex-shrink: 0;
        }
        .admin-panel .category-section h3 { font-size: 14px; font-weight: 500; color: #aaa; margin-bottom: 10px; }
        .admin-panel .category-section .cat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .admin-panel .category-section .cat-item .cat-name { color: #ddd; font-size: 14px; }
        .admin-panel .category-section .cat-item .cat-count { color: #888; font-size: 12px; margin-left: 8px; }
        .admin-panel .category-section .cat-item .del-cat-btn {
            background: transparent;
            border: none;
            color: #e05a5a;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .admin-panel .category-section .cat-item .del-cat-btn:hover { background: rgba(224,90,90,0.15); color: #ff7a7a; }
        .admin-panel .category-section .add-cat-form {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .admin-panel .category-section .add-cat-form input,
        .admin-panel .category-section .add-cat-form select {
            background: #0e0e0e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 14px;
            color: #f0f0f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            flex: 1;
            min-width: 100px;
        }
        .admin-panel .category-section .add-cat-form button {
            background: rgba(212,165,116,0.15);
            border: 1px solid rgba(212,165,116,0.2);
            color: #d4a574;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            white-space: nowrap;
        }
        .admin-panel .category-section .add-cat-form button:hover { background: rgba(212,165,116,0.25); border-color: #d4a574; }
        .admin-panel .panel-footer {
            flex-shrink: 0;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-panel .panel-footer button {
            background: rgba(212,165,116,0.12);
            border: 1px solid rgba(212,165,116,0.2);
            color: #d4a574;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .admin-panel .panel-footer button:hover { background: rgba(212,165,116,0.2); border-color: #d4a574; }
        .admin-panel .panel-footer button.danger {
            background: rgba(224,90,90,0.1);
            border-color: rgba(224,90,90,0.2);
            color: #e05a5a;
        }
        .admin-panel .panel-footer button.danger:hover { background: rgba(224,90,90,0.18); }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {

        // ---- 本地存储 ----
        function loadPhotos() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (Array.isArray(data) && data.length) return data;
                } catch (e) {}
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_PHOTOS));
            return DEFAULT_PHOTOS.slice();
        }

        function savePhotos(photos) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
        }

        function loadCountries() {
            const stored = localStorage.getItem(COUNTRY_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (Array.isArray(data)) return data;
                } catch (e) {}
            }
            const photos = loadPhotos();
            const set = new Set();
            photos.forEach(p => set.add(p.country));
            const list = Array.from(set).sort();
            saveCountries(list);
            return list;
        }

            localStorage.setItem(COUNTRY_KEY, JSON.stringify(countries));

            if (stored) {

            const set = new Set();
            photos.forEach(p => set.add(JSON.stringify({ country: p.country, city: p.city })));
            const list = Array.from(set).map(s => JSON.parse(s));
            saveCities(list);
            return list;

            const countries = loadCountries();
            if (countries.includes(name)) return false;
            countries.push(name);
            countries.sort();
            saveCountries(countries);
            return true;

            let photos = loadPhotos();
            photos = photos.filter(p => p.country !== name);
            savePhotos(photos);
            let cities = loadCities();
            cities = cities.filter(c => c.country !== name);
            saveCities(cities);
            let countries = loadCountries();
            countries = countries.filter(c => c !== name);
            saveCountries(countries);
            syncToSupabase(photos);
        }

            const cities = loadCities();
            if (cities.some(c => c.country === country && c.city === city)) return false;
            cities.push({ country, city });
            cities.sort((a, b) => a.country.localeCompare(b.country) || a.city.localeCompare(b.city));
            saveCities(cities);
            return true;

                if (p.country && p.city) {

        // ---- Supabase 同步 ----
        async function syncToSupabase(photos) {
            const statusEl = document.getElementById('syncStatus');
            if (statusEl) {
                statusEl.textContent = '⏳ 正在同步到云端...';
                statusEl.style.color = '#d4a574';
            }
            try {
                const listRes = await fetch(`${SUPABASE_URL}photos?select=id`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (!listRes.ok) throw new Error('获取云端列表失败');
                const existing = await listRes.json();
                for (const item of existing) {
                    await fetch(`${SUPABASE_URL}photos?id=eq.${item.id}`, {
                        method: 'DELETE',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    });
                }
                for (const p of photos) {
                    await fetch(`${SUPABASE_URL}photos`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(p)
                    });
                }
                if (statusEl) {
                    statusEl.textContent = '✅ 已同步到云端';
                    statusEl.style.color = '#6fcf97';
                }
            } catch (error) {
                console.warn('Supabase 同步失败', error);
                if (statusEl) {
                    statusEl.textContent = '⚠️ 云端同步失败，数据仅保存在本地';
                    statusEl.style.color = '#e05a5a';
                }
            }
        }

                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (!res.ok) throw new Error('读取云端失败');

                    if (statusEl) {
                        statusEl.textContent = '✅ 已从云端同步';

                } else {

                    await syncToSupabase(localPhotos);
                    if (statusEl) {
                        statusEl.textContent = '✅ 已从云端同步';
                        statusEl.style.color = '#6fcf97';
                    }
                    return true;
                }
            } catch (error) {
                console.warn('云端加载失败，使用本地数据', error);
                if (statusEl) {
                    statusEl.textContent = '⚠️ 云端加载失败，使用本地数据';
                    statusEl.style.color = '#e05a5a';
                }
                return false;
            }
        }

        // ---- Cloudinary 上传 ----
        function uploadToCloudinary(file) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', UPLOAD_PRESET);
                fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.secure_url) resolve(data.secure_url);
                        else reject(new Error('Cloudinary 返回错误：' + JSON.stringify(data)));
                    })
                    .catch(err => reject(err));
            });
        }

            });
        });

        document.getElementById('enterGallery').addEventListener('click', () => showPage('works'));

        // ================================================================
        //  轮播（首页）
        // ================================================================
        let carouselInterval = null;
        let carouselIndex = 0;

        function initCarousel() {
            const photos = loadPhotos();
            const slidesContainer = document.getElementById('carouselSlides');
            const dotsContainer = document.getElementById('carouselDots');
            // 只取前6张作为展示（可自定义）
            const carouselPhotos = photos.slice(0, 6);
            if (carouselPhotos.length === 0) {
                slidesContainer.innerHTML = '<div class="slide" style="justify-content:center;color:#aaa;">暂无照片</div>';
                return;
            }
            slidesContainer.innerHTML = carouselPhotos.map((p, i) =>
                `<div class="slide"><img src="${p.image}" alt="${p.title}" /></div>`
            ).join('');
            dotsContainer.innerHTML = carouselPhotos.map((_, i) =>
                `<span class="${i===0?'active':''}" data-index="${i}"></span>`
            ).join('');
            carouselIndex = 0;
            updateCarousel();

            // 自动播放
            if (carouselInterval) clearInterval(carouselInterval);
            carouselInterval = setInterval(() => {
                const total = carouselPhotos.length;
                carouselIndex = (carouselIndex + 1) % total;
                updateCarousel();
            }, 4000);

            // 点击圆点切换
            dotsContainer.querySelectorAll('span').forEach(dot => {
                dot.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    carouselIndex = idx;
                    updateCarousel();
                    // 重置计时器
                    if (carouselInterval) {
                        clearInterval(carouselInterval);
                        carouselInterval = setInterval(() => {
                            const total = carouselPhotos.length;
                            carouselIndex = (carouselIndex + 1) % total;
                            updateCarousel();
                        }, 4000);
                    }
                });
            });
        }

        function updateCarousel() {
            const slides = document.getElementById('carouselSlides');
            const dots = document.getElementById('carouselDots').querySelectorAll('span');
            if (!slides || dots.length === 0) return;
            slides.style.transform = `translateX(-${carouselIndex * 100}%)`;
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === carouselIndex);
            });
        }

        // ================================================================
        //  作品页渲染（国家→城市→照片）
        // ================================================================
        let selectedCountry = null;
        let selectedCity = null;

        function renderWorks() {
            const photos = loadPhotos();
            const filterSection = document.getElementById('filterSection');
            const grid = document.getElementById('photoGrid');

            // 获取所有国家（从照片中提取）
            const countries = Array.from(new Set(photos.map(p => p.country))).sort();

            // 如果未选择国家，显示国家列表
            if (!selectedCountry) {
                filterSection.innerHTML = `
                    <span class="filter-label">国家：</span>
                    <button class="filter-btn active" data-country="all">全部</button>
                    ${countries.map(c => `<button class="filter-btn" data-country="${c}">${c}</button>`).join('')}
                `;
                filterSection.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const country = this.dataset.country;
                        if (country === 'all') {
                            selectedCountry = null;
                            selectedCity = null;
                        } else {
                            selectedCountry = country;
                            selectedCity = null;
                        }
                        renderWorks();
                    });
                });
                // 显示所有照片（按城市分组或直接全部）
                displayPhotos(photos, null);
                return;
            }

            // 已选择国家，显示该国家下的城市列表
            const cities = Array.from(new Set(photos.filter(p => p.country === selectedCountry).map(p => p.city))).sort();

            filterSection.innerHTML = `
                <button class="filter-back" id="backToCountries"><i class="fas fa-arrow-left"></i> 返回国家</button>
                <span class="filter-label">城市：</span>
                <button class="filter-btn city-btn active" data-city="all">全部</button>
                ${cities.map(c => `<button class="filter-btn city-btn" data-city="${c}">${c}</button>`).join('')}
            `;
            filterSection.querySelector('#backToCountries').addEventListener('click', function() {
                selectedCountry = null;
                selectedCity = null;
                renderWorks();
            });
            filterSection.querySelectorAll('.city-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const city = this.dataset.city;
                    if (city === 'all') {
                        selectedCity = null;
                    } else {
                        selectedCity = city;
                    }
                    renderWorks();
                });
            });

            // 过滤照片
            let filtered = photos.filter(p => p.country === selectedCountry);
            if (selectedCity) {
                filtered = filtered.filter(p => p.city === selectedCity);
            }
            displayPhotos(filtered, selectedCity);
        }

        function displayPhotos(photos, city) {
            const grid = document.getElementById('photoGrid');
            if (photos.length === 0) {
                grid.innerHTML = `<div class="empty-state">没有找到照片</div>`;
                return;
            }
            grid.innerHTML = photos.map(p => `
                <div class="grid-item" data-id="${p.id}">
                    <img src="${p.image}" alt="${p.title}" loading="lazy" />
                    <div class="overlay">
                        <div class="title">${p.title}</div>
                        <div class="city">${p.country} · ${p.city}</div>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.grid-item').forEach(item => {
                item.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    openPhotoModal(id);
                });
            });
        }

        // ================================================================
        //  照片详情模态框
        // ================================================================
        function openPhotoModal(id) {
            const photo = loadPhotos().find(p => p.id === id);
            if (!photo) return;
            document.getElementById('modalImage').src = photo.image;
            document.getElementById('modalTitle').textContent = photo.title;
            document.getElementById('modalCity').textContent = `${photo.country} · ${photo.city}`;
            document.getElementById('modalLocation').textContent = photo.location ? `📍 ${photo.location}` : '';
            document.getElementById('photoModal').classList.add('active');
            // 保存当前照片id用于拍立得
            document.getElementById('photoModal').dataset.photoId = photo.id;
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('modalClose').addEventListener('click', function() {
            document.getElementById('photoModal').classList.remove('active');
            document.body.style.overflow = '';
        });
        document.getElementById('photoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        // ---- 模态框中的拍立得按钮 ----
        document.getElementById('modalPrinterBtn').addEventListener('click', function() {
            const modal = document.getElementById('photoModal');
            const id = parseInt(modal.dataset.photoId);
            if (!id) return;
            const photo = loadPhotos().find(p => p.id === id);
            if (!photo) return;
            showPolaroid(photo);
        });

        // ================================================================
        //  拍立得全屏
        // ================================================================
        function showPolaroid(photo) {
            document.getElementById('polaroidImg').src = photo.image;
            document.getElementById('polaroidTitle').textContent = photo.title;
            document.getElementById('polaroidCity').textContent = `${photo.country} · ${photo.city}`;
            document.getElementById('polaroidLocation').textContent = photo.location ? `📍 ${photo.location}` : '';
            document.getElementById('polaroidFullscreen').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        document.getElementById('polaroidClose').addEventListener('click', function() {
            document.getElementById('polaroidFullscreen').classList.remove('active');
            document.body.style.overflow = '';
        });
        document.getElementById('polaroidFullscreen').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        // ================================================================
        //  管理面板（保留原有逻辑 + location 字段）
        // ================================================================
        let isAuthorized = false;
        const adminAuth = document.getElementById('adminAuth');
        const adminContent = document.getElementById('adminContent');
        const authPassword = document.getElementById('authPassword');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authError = document.getElementById('authError');

        function showAuth() {
            adminAuth.style.display = 'flex';
            adminContent.classList.remove('visible');
            authPassword.value = '';
            authError.textContent = '';
            isAuthorized = false;
        }

        function authorize() {
            const pwd = authPassword.value.trim();
            if (pwd === ADMIN_PASSWORD) {
                isAuthorized = true;
                adminAuth.style.display = 'none';
                adminContent.classList.add('visible');
                authError.textContent = '';
                loadAdminData();
            } else {
                authError.textContent = '❌ 密码错误，请重试';
                authPassword.value = '';
                authPassword.focus();
            }
        }

        authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') authorize(); });
        authSubmitBtn.addEventListener('click', authorize);

        const adminToggle = document.getElementById('adminToggle');
        const adminPanel = document.getElementById('adminPanel');
        const adminClose = document.getElementById('adminClose');

        adminToggle.addEventListener('click', () => {
            adminPanel.classList.toggle('open');
            if (adminPanel.classList.contains('open')) showAuth();
        });
        adminClose.addEventListener('click', () => {
            adminPanel.classList.remove('open');
            isAuthorized = false;
            adminContent.classList.remove('visible');
            adminAuth.style.display = 'flex';
            authPassword.value = '';
            authError.textContent = '';
            closeEditForm();
        });

        // ---- 管理数据加载 ----
        function loadAdminData() {
            if (!isAuthorized) return;
            const photos = loadPhotos();
            renderAdminList(photos);
            renderCountryAdminList();
            renderCityAdminList();
            populateCountrySelect();
            populateFormSelects('', '');
            closeEditForm();
        }

        function renderAdminList(photos) {
            const list = document.getElementById('adminPhotoList');
            if (photos.length === 0) {
                list.innerHTML = `<div style="color:#666;text-align:center;padding:30px;">暂无照片，点击 "添加照片" 上传</div>`;
                return;
            }
            list.innerHTML = photos.map(p => `
                <div class="photo-item" data-id="${p.id}">
                    <img class="thumb" src="${p.image}" alt="${p.title}" />
                    <div class="info">
                        <div class="item-title">${p.title}</div>
                        <div class="item-city">${p.country} · ${p.city}</div>
                    </div>
                    <div class="actions">
                        <button class="edit-btn" data-id="${p.id}">✏️ 编辑</button>
                        <button class="del-btn" data-id="${p.id}">🗑️ 删除</button>
                    </div>
                </div>
            `).join('');

            list.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    openEditForm(id);
                });
            });
            list.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    if (confirm('确定删除这张照片吗？')) {
                        deletePhoto(id);
                    }
                });
            });
        }

        function renderCountryAdminList() {
            const countries = loadCountries();
            const list = document.getElementById('countryListAdmin');
            if (countries.length === 0) {
                list.innerHTML = `<div style="color:#666;font-size:13px;padding:4px 0;">暂无国家</div>`;
                return;
            }
            list.innerHTML = countries.map(c => {
                const count = loadPhotos().filter(p => p.country === c).length;
                return `
                    <div class="cat-item">
                        <span><span class="cat-name">${c}</span> <span class="cat-count">（${count} 张）</span></span>
                        <button class="del-cat-btn" data-country="${c}">删除</button>
                    </div>
                `;
            }).join('');
            list.querySelectorAll('.del-cat-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const country = this.dataset.country;
                    if (confirm(`确定删除国家“${country}”及其所有照片吗？此操作不可撤销！`)) {
                        deleteCountry(country);
                        refreshAll();
                    }
                });
            });
            populateCountrySelect();
        }

        function renderCityAdminList() {
            const cities = loadCities();
            const list = document.getElementById('cityListAdmin');
            if (cities.length === 0) {
                list.innerHTML = `<div style="color:#666;font-size:13px;padding:4px 0;">暂无城市</div>`;
                return;
            }
            let html = '';
            const countries = loadCountries();
            countries.forEach(country => {
                const citiesInCountry = cities.filter(c => c.country === country);
                if (citiesInCountry.length === 0) return;
                html += `<div style="margin-top:4px;color:#888;font-size:12px;">${country}</div>`;
                citiesInCountry.forEach(c => {
                    const count = loadPhotos().filter(p => p.country === country && p.city === c.city)
                        .length;
                    html += `
                        <div class="cat-item" style="padding-left:16px;">
                            <span><span class="cat-name">${c.city}</span> <span class="cat-count">（${count} 张）</span></span>
                            <button class="del-cat-btn" data-country="${country}" data-city="${c.city}">删除</button>
                        </div>
                    `;
                });
            });
            list.innerHTML = html;
            list.querySelectorAll('.del-cat-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const country = this.dataset.country;
                    const city = this.dataset.city;
                    if (confirm(`确定删除城市“${city}”（${country}）及其所有照片吗？此操作不可撤销！`)) {
                        deleteCity(country, city);
                        refreshAll();
                    }
                });
            });
        }

        // ---- 照片 CRUD ----
        function addPhoto(title, country, city, location, imageUrl) {
            const photos = loadPhotos();
            const newPhoto = {
                id: nextId(photos),
                title: title.trim(),
                country: country.trim(),
                city: city.trim(),
                location: location.trim(),
                image: imageUrl
            };
            photos.push(newPhoto);
            savePhotos(photos);
            syncCategories();
            syncToSupabase(photos);
            refreshAll();
        }

        function updatePhoto(id, title, country, city, location, imageUrl) {
            const photos = loadPhotos();
            const idx = photos.findIndex(p => p.id === id);
            if (idx === -1) return;
            const updated = { ...photos[idx] };
            if (title) updated.title = title.trim();
            if (country) updated.country = country.trim();
            if (city) updated.city = city.trim();
            if (location !== undefined) updated.location = location.trim();
            if (imageUrl) updated.image = imageUrl;
            photos[idx] = updated;
            savePhotos(photos);
            syncCategories();
            syncToSupabase(photos);
            refreshAll();
        }

        function deletePhoto(id) {
            let photos = loadPhotos();
            photos = photos.filter(p => p.id !== id);
            savePhotos(photos);
            syncCategories();
            syncToSupabase(photos);
            refreshAll();
            if (currentPhotoId === id) closeModal();
        }

        function nextId(photos) {
            if (!photos.length) return 1;
            return Math.max(...photos.map(p => p.id)) + 1;
        }

        // ---- 编辑表单 ----
        let editingId = null;

        function openEditForm(id) {
            if (!isAuthorized) return;
            editingId = id;
            const photos = loadPhotos();
            const photo = photos.find(p => p.id === id);
            if (!photo) return;
            document.getElementById('formTitle').value = photo.title;
            document.getElementById('formLocation').value = photo.location || '';
            document.getElementById('formImageUrl').value = photo.image || '';
            document.getElementById('formFile').value = '';
            populateFormSelects(photo.country, photo.city);
            document.getElementById('editForm').classList.add('show');
            document.getElementById('editForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function closeEditForm() {
            document.getElementById('editForm').classList.remove('show');
            editingId = null;
            document.getElementById('formFile').value = '';
            document.getElementById('formImageUrl').value = '';
            document.getElementById('formTitle').value = '';
            document.getElementById('formLocation').value = '';
            document.getElementById('formCountry').value = '';
            document.getElementById('formCity').innerHTML = `<option value="">— 请先选择国家 —</option>`;
        }

        function saveForm() {
            if (!isAuthorized) return;
            const title = document.getElementById('formTitle').value.trim();
            const country = document.getElementById('formCountry').value;
            const city = document.getElementById('formCity').value;
            const location = document.getElementById('formLocation').value.trim();
            if (!title || !country || !city) {
                alert('标题、国家和城市都不能为空');
                return;
            }

            const file = document.getElementById('formFile').files[0];
            const imageUrlInput = document.getElementById('formImageUrl').value.trim();

            if (imageUrlInput && !file) {
                if (imageUrlInput.startsWith('http')) {
                    if (editingId) {
                        updatePhoto(editingId, title, country, city, location, imageUrlInput);
                    } else {
                        addPhoto(title, country, city, location, imageUrlInput);
                    }
                    closeEditForm();
                    return;
                } else {
                    alert('请输入有效的图片链接（以 http 开头）');
                    return;
                }
            }

            if (file) {
                const status = document.getElementById('syncStatus');
                status.textContent = '⏳ 正在上传到 Cloudinary...';
                status.style.color = '#d4a574';
                uploadToCloudinary(file)
                    .then(url => {
                        if (editingId) {
                            updatePhoto(editingId, title, country, city, location, url);
                        } else {
                            addPhoto(title, country, city, location, url);
                        }
                        status.textContent = '✅ 上传成功，数据已保存';
                        status.style.color = '#6fcf97';
                        closeEditForm();
                    })
                    .catch(err => {
                        console.error('上传失败', err);
                        status.textContent = '❌ 上传失败：' + err.message;
                        status.style.color = '#e05a5a';
                        alert('照片上传失败，请检查网络或 Cloudinary 配置');
                    });
                return;
            }

            alert('请选择一张照片或输入图片链接');
        }

        // ---- 表单下拉填充 ----
        function populateFormSelects(selectedCountry, selectedCity) {
            const countries = loadCountries();
            const formCountry = document.getElementById('formCountry');
            formCountry.innerHTML = `<option value="">— 选择国家 —</option>`;
            countries.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                if (c === selectedCountry) opt.selected = true;
                formCountry.appendChild(opt);
            });
            populateCitySelect(selectedCountry, selectedCity);
        }

        function populateCitySelect(country, selectedCity) {
            const formCity = document.getElementById('formCity');
            formCity.innerHTML = `<option value="">— 请先选择国家 —</option>`;
            if (!country) return;
            const cities = getCitiesByCountry(country);
            cities.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                if (c === selectedCity) opt.selected = true;
                formCity.appendChild(opt);
            });
        }

        function populateCountrySelect() {
            const countries = loadCountries();
            const select = document.getElementById('cityCountrySelect');
            const currentVal = select.value;
            select.innerHTML = `<option value="">— 选择国家 —</option>`;
            countries.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });
            if (currentVal && countries.includes(currentVal)) {
                select.value = currentVal;
            }
        }

        // ---- 监听国家下拉联动 ----
        document.getElementById('formCountry').addEventListener('change', function() {
            const country = this.value;
            populateCitySelect(country, '');
        });

        // ---- 添加国家/城市 ----
        document.getElementById('addCountryBtn').addEventListener('click', function() {
            if (!isAuthorized) return;
            const input = document.getElementById('newCountryInput');
            const name = input.value.trim();
            if (!name) return alert('请输入国家名称');
            if (loadCountries().includes(name)) return alert('国家已存在');
            addCountry(name);
            input.value = '';
            refreshAll();
        });

        document.getElementById('addCityBtn').addEventListener('click', function() {
            if (!isAuthorized) return;
            const country = document.getElementById('cityCountrySelect').value;
            const cityName = document.getElementById('newCityInput').value.trim();
            if (!country) return alert('请选择国家');
            if (!cityName) return alert('请输入城市名称');
            const cities = loadCities();
            if (cities.some(c => c.country === country && c.city === cityName)) {
                return alert('该城市已存在');
            }
            addCity(country, cityName);
            document.getElementById('newCityInput').value = '';
            refreshAll();
        });

        // ---- 添加照片按钮 ----
        document.getElementById('addPhotoBtn').addEventListener('click', function() {
            if (!isAuthorized) return;
            editingId = null;
            document.getElementById('formTitle').value = '';
            document.getElementById('formLocation').value = '';
            document.getElementById('formImageUrl').value = '';
            document.getElementById('formFile').value = '';
            populateFormSelects('', '');
            document.getElementById('editForm').classList.add('show');
            document.getElementById('formTitle').focus();
        });

        document.getElementById('formCancelBtn').addEventListener('click', closeEditForm);
        document.getElementById('formSaveBtn').addEventListener('click', saveForm);

        // ---- 恢复默认 ----
        document.getElementById('resetDefaultBtn').addEventListener('click', function() {
            if (confirm('将恢复默认示例照片，当前数据将被覆盖，确定吗？')) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_PHOTOS));
                localStorage.setItem(COUNTRY_KEY, JSON.stringify(DEFAULT_COUNTRIES));
                localStorage.setItem(CITY_KEY, JSON.stringify(DEFAULT_CITIES));
                refreshAll();
                syncToSupabase(DEFAULT_PHOTOS);
            }
        });

        // ---- 刷新所有UI ----
        function refreshAll() {
            const photos = loadPhotos();
            renderAdminList(photos);
            renderCountryAdminList();
            renderCityAdminList();
            populateCountrySelect();
            if (editingId !== null) {
                const photo = photos.find(p => p.id === editingId);
                if (photo) populateFormSelects(photo.country, photo.city);
                else populateFormSelects('', '');
            } else {
                populateFormSelects('', '');
            }
            // 刷新作品页（如果当前在works）
            if (document.getElementById('page-works').classList.contains('active')) {
                renderWorks();
            }
            // 刷新首页轮播（如果当前在home）
            if (document.getElementById('page-home').classList.contains('active')) {
                initCarousel();
            }
            // 更新模态框中的拍立得数据无影响
        }

        // ================================================================
        //  初始化
        // ================================================================
        async function init() {
            syncCategories();
            await loadFromSupabase();
            const photos = loadPhotos();
            // 如果照片为空，写入默认
            if (photos.length === 0) {
                savePhotos(DEFAULT_PHOTOS);
                saveCountries(DEFAULT_COUNTRIES);
                saveCities(DEFAULT_CITIES);
                await syncToSupabase(DEFAULT_PHOTOS);
            }
            renderWorks();
            showAuth();
            // 首页默认显示轮播
            setTimeout(initCarousel, 300);
            console.log('✨ kk\'s Photography 已加载 (Supabase + Cloudinary)');
            console.log('📸 照片总数:', loadPhotos().length);
            console.log('🔒 管理密码:', ADMIN_PASSWORD);
        }

        init();

        // 当窗口大小变化时，重新初始化轮播（防止变形）
        window.addEventListener('resize', () => {
            if (document.getElementById('page-home').classList.contains('active')) {
                initCarousel();
            }
        });
    </script>

</body>
