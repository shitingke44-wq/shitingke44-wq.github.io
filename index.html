<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kk的摄影</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0e0e0e;
            color: #f0f0f0;
            min-height: 100vh;
            padding-top: 72px;
            scroll-behavior: smooth;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4a574;
            border-radius: 6px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(14, 14, 14, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0 40px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .navbar .logo span {
            color: #d4a574;
        }

        .navbar .logo i {
            font-size: 22px;
            color: #d4a574;
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: center;
        }

        .nav-cities {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-cities .city-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #aaa;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .nav-cities .city-btn:hover {
            border-color: rgba(212, 165, 116, 0.5);
            color: #fff;
        }

        .nav-cities .city-btn.active {
            background: #d4a574;
            border-color: #d4a574;
            color: #0e0e0e;
        }

        .nav-cities .city-btn.all-btn {
            border-color: rgba(255, 255, 255, 0.2);
            color: #ccc;
        }

        .nav-cities .city-btn.all-btn.active {
            background: #fff;
            border-color: #fff;
            color: #0e0e0e;
        }

        /* ===== 搜索框 ===== */
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 4px 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s;
            flex-shrink: 0;
        }

        .search-box:focus-within {
            border-color: #d4a574;
            background: rgba(255, 255, 255, 0.1);
        }

        .search-box i {
            color: #888;
            font-size: 14px;
            margin-right: 8px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: #eee;
            padding: 8px 0;
            font-size: 14px;
            width: 150px;
            outline: none;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: #666;
        }

        /* ===== 照片网格 ===== */
        .gallery {
            max-width: 1440px;
            margin: 0 auto;
            padding: 30px 40px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .photo-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #1a1a1a;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.4s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            aspect-ratio: 4 / 3;
        }

        .photo-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover img {
            transform: scale(1.04);
        }

        .photo-card .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 22px 18px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.75) 50%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            opacity: 0;
            transform: translateY(12px);
            transition: all 0.35s ease;
        }

        .photo-card:hover .card-overlay {
            opacity: 1;
            transform: translateY(0);
        }

        .photo-card .card-overlay .photo-title {
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #fff;
        }

        .photo-card .card-overlay .photo-city {
            font-size: 13px;
            color: #d4a574;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(212, 165, 116, 0.2);
        }

        /* 高亮动画 (随机选中) */
        .photo-card.highlight {
            animation: highlightPulse 1.2s ease 3;
            z-index: 10;
            box-shadow: 0 0 0 4px #d4a574, 0 12px 48px rgba(212, 165, 116, 0.25);
        }

        @keyframes highlightPulse {
            0%,
            100% {
                box-shadow: 0 0 0 4px #d4a574, 0 12px 48px rgba(212, 165, 116, 0.25);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(212, 165, 116, 0.3), 0 12px 60px rgba(212, 165, 116, 0.4);
                transform: scale(1.02);
            }
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #666;
            font-size: 18px;
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: #333;
        }

        /* ===== 模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            position: relative;
            max-width: 900px;
            width: 100%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: modalIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: -48px;
            right: 0;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: #fff;
            font-size: 28px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .modal-image-wrap {
            width: 100%;
            background: #111;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .modal-image-wrap img {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            background: #0a0a0a;
        }

        /* 模态框底部：信息 + 打印机 */
        .modal-footer {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 6px 6px 6px;
            color: #ccc;
            flex-wrap: wrap;
            gap: 12px;
        }

        .modal-footer .photo-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .modal-footer .photo-info .modal-title {
            font-size: 20px;
            font-weight: 500;
            color: #fff;
        }

        .modal-footer .photo-info .modal-city {
            font-size: 14px;
            color: #d4a574;
        }

        .modal-footer .actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .modal-footer .actions .printer-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }

        .modal-footer .actions .printer-btn i {
            font-size: 20px;
        }

        .modal-footer .actions .printer-btn:hover {
            background: rgba(212, 165, 116, 0.15);
            border-color: #d4a574;
            color: #d4a574;
            transform: scale(1.04);
        }

        .modal-footer .actions .printer-btn.active {
            background: rgba(212, 165, 116, 0.2);
            border-color: #d4a574;
            color: #d4a574;
        }

        /* ===== 宝丽来拍立得样式 ===== */
        .polaroid-container {
            display: none;
            margin-top: 20px;
            animation: polaroidAppear 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            width: 100%;
            display: none;
            justify-content: center;
        }

        .polaroid-container.show {
            display: flex;
        }

        @keyframes polaroidAppear {
            from {
                opacity: 0;
                transform: scale(0.9) rotate(-2deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .polaroid-frame {
            background: #f5f2ed;
            padding: 20px 20px 56px 20px;
            border-radius: 6px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 4px 16px rgba(0, 0, 0, 0.3);
            max-width: 480px;
            width: 100%;
            transition: all 0.3s ease;
            transform: rotate(0.6deg);
        }

        .polaroid-frame .polaroid-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 2px;
            background: #111;
        }

        .polaroid-frame .polaroid-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .polaroid-frame .polaroid-caption {
            text-align: center;
            margin-top: 14px;
            font-family: 'Courier New', 'Georgia', serif;
            font-size: 15px;
            color: #2d2d2d;
            letter-spacing: 0.5px;
            line-height: 1.6;
            font-weight: 400;
        }

        .polaroid-frame .polaroid-caption .p-title {
            font-weight: 600;
            font-size: 16px;
        }

        .polaroid-frame .polaroid-caption .p-city {
            color: #8a7a6a;
            font-size: 13px;
        }

        .polaroid-frame .polaroid-caption .p-date {
            color: #aaa;
            font-size: 11px;
            margin-top: 2px;
            font-style: italic;
        }

        /* 关闭拍立得按钮 */
        .polaroid-close-btn {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #999;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .polaroid-close-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* ===== 页脚 ===== */
        .footer {
            text-align: center;
            padding: 40px 20px 30px;
            color: #444;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            letter-spacing: 0.3px;
        }

        .footer span {
            color: #d4a574;
        }

        /* ===== 管理按钮（右下角齿轮） ===== */
        .admin-toggle {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 3000;
            background: rgba(212, 165, 116, 0.9);
            color: #0e0e0e;
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 8px 28px rgba(212, 165, 116, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-toggle:hover {
            transform: scale(1.08);
            background: #d4a574;
            box-shadow: 0 12px 40px rgba(212, 165, 116, 0.6);
        }

        /* ===== 管理面板（侧滑） ===== */
        .admin-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 560px;
            height: 100vh;
            background: #141414;
            z-index: 4000;
            padding: 24px 24px 30px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: -8px 0 48px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .admin-panel.open {
            right: 0;
        }

        .admin-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .admin-panel .panel-header h2 {
            font-size: 22px;
            font-weight: 500;
            color: #fff;
        }

        .admin-panel .panel-header h2 i {
            color: #d4a574;
            margin-right: 8px;
        }

        .admin-panel .panel-close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .admin-panel .panel-close:hover {
            color: #fff;
        }

        /* ===== 密码验证区域 ===== */
        .admin-auth {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
            padding: 30px 0;
        }

        .admin-auth .auth-icon {
            font-size: 48px;
            color: #d4a574;
        }

        .admin-auth .auth-title {
            font-size: 18px;
            color: #ddd;
        }

        .admin-auth .auth-input-group {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .admin-auth .auth-input-group input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #0e0e0e;
            color: #f0f0f0;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            min-width: 180px;
        }

        .admin-auth .auth-input-group input:focus {
            border-color: #d4a574;
        }

        .admin-auth .auth-input-group button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: #d4a574;
            color: #0e0e0e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.25s;
            font-family: inherit;
        }

        .admin-auth .auth-input-group button:hover {
            background: #e0b88a;
        }

        .admin-auth .auth-error {
            color: #e05a5a;
            font-size: 14px;
            min-height: 20px;
        }

        /* 管理内容（默认隐藏） */
        .admin-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }

        .admin-content.visible {
            display: flex;
        }

        .admin-panel .photo-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
            max-height: 300px;
        }

        .admin-panel .photo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1e1e1e;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s;
        }

        .admin-panel .photo-item:hover {
            background: #262626;
        }

        .admin-panel .photo-item .thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #111;
            flex-shrink: 0;
        }

        .admin-panel .photo-item .info {
            flex: 1;
            min-width: 0;
        }

        .admin-panel .photo-item .info .item-title {
            font-weight: 500;
            font-size: 15px;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-panel .photo-item .info .item-city {
            font-size: 13px;
            color: #d4a574;
        }

        .admin-panel .photo-item .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .admin-panel .photo-item .actions button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #aaa;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .admin-panel .photo-item .actions .edit-btn:hover {
            border-color: #d4a574;
            color: #d4a574;
            background: rgba(212, 165, 116, 0.08);
        }

        .admin-panel .photo-item .actions .del-btn:hover {
            border-color: #e05a5a;
            color: #e05a5a;
            background: rgba(224, 90, 90, 0.08);
        }

        /* ===== 分类管理（国家 & 城市） ===== */
        .category-section {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
            flex-shrink: 0;
        }

        .category-section h3 {
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 10px;
        }

        .category-section .cat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .category-section .cat-item .cat-name {
            color: #ddd;
            font-size: 14px;
        }

        .category-section .cat-item .cat-count {
            color: #888;
            font-size: 12px;
            margin-left: 8px;
        }

        .category-section .cat-item .del-cat-btn {
            background: transparent;
            border: none;
            color: #e05a5a;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .category-section .cat-item .del-cat-btn:hover {
            background: rgba(224, 90, 90, 0.15);
            color: #ff7a7a;
        }

        .category-section .add-cat-form {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .category-section .add-cat-form input,
        .category-section .add-cat-form select {
            background: #0e0e0e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 14px;
            color: #f0f0f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            flex: 1;
            min-width: 100px;
        }

        .category-section .add-cat-form input:focus,
        .category-section .add-cat-form select:focus {
            border-color: #d4a574;
        }

        .category-section .add-cat-form button {
            background: rgba(212, 165, 116, 0.15);
            border: 1px solid rgba(212, 165, 116, 0.2);
            color: #d4a574;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            white-space: nowrap;
        }

        .category-section .add-cat-form button:hover {
            background: rgba(212, 165, 116, 0.25);
            border-color: #d4a574;
        }

        .admin-panel .panel-footer {
            flex-shrink: 0;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-panel .panel-footer button {
            background: rgba(212, 165, 116, 0.12);
            border: 1px solid rgba(212, 165, 116, 0.2);
            color: #d4a574;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .admin-panel .panel-footer button:hover {
            background: rgba(212, 165, 116, 0.2);
            border-color: #d4a574;

        // ---- 读取/写入本地 ----
        function loadPhotos() {
            const stored = localStorage.getItem(STORAGE_KEY);

                try {
                    const data = JSON.parse(stored);
                    if (Array.isArray(data) && data.length) {
                        if (!data[0].country) {
                            const migrated = data.map(p => ({ ...p, country: '中国' }));
                            savePhotos(migrated);
                            return migrated;
                        }
                        return data;
                    }
                } catch (e) { /* 忽略 */ }
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_PHOTOS));
            return DEFAULT_PHOTOS.slice();
        }

        function savePhotos(photos) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
        }

        function loadCountries() {
            const stored = localStorage.getItem(COUNTRY_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (Array.isArray(data)) return data;
                } catch (e) { /* 忽略 */ }
            }
            const photos = loadPhotos();
            const set = new Set();
            photos.forEach(p => set.add(p.country));
            const list = Array.from(set).sort();
            saveCountries(list);
            return list;
        }

        function saveCountries(countries) {
            localStorage.setItem(COUNTRY_KEY, JSON.stringify(countries));

        function loadCities() {
            const stored = localStorage.getItem(CITY_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (Array.isArray(data)) return data;
                } catch (e) { /* 忽略 */ }
            }
            const photos = loadPhotos();
            const set = new Set();
            photos.forEach(p => set.add(JSON.stringify({ country: p.country, city: p.city })));
            const list = Array.from(set).map(s => JSON.parse(s));
            saveCities(list);
            return list;
        }

            localStorage.setItem(CITY_KEY, JSON.stringify(cities));

            const all = loadCities();
            return all.filter(c => c.country === country).map(c => c.city).sort();

            if (countries.includes(name)) return false;
            countries.push(name);
            countries.sort();

            photos = photos.filter(p => p.country !== name);

            cities = cities.filter(c => c.country !== name);

            let countries = loadCountries();
            countries = countries.filter(c => c !== name);
            saveCountries(countries);

            const cities = loadCities();
            const exists = cities.some(c => c.country === country && c.city === city);

            cities.push({ country, city });
            cities.sort((a, b) => a.country.localeCompare(b.country) || a.city.localeCompare(b.city));
            saveCities(cities);
            return true;
        }

        function deleteCity(country, city) {
            let photos = loadPhotos();
            photos = photos.filter(p => !(p.country === country && p.city === city));
            savePhotos(photos);
            let cities = loadCities();
            cities = cities.filter(c => !(c.country === country && c.city === city));
            saveCities(cities);
        }

        function syncCategories() {
            const photos = loadPhotos();
            const countrySet = new Set(loadCountries());
            const citySet = new Set(loadCities().map(c => JSON.stringify(c)));

            photos.forEach(p => {
                if (p.country) countrySet.add(p.country);
                if (p.country && p.city) {
                    citySet.add(JSON.stringify({ country: p.country, city: p.city }));
                }
            });

            const newCountries = Array.from(countrySet).sort();
            const newCities = Array.from(citySet).map(s => JSON.parse(s)).sort((a, b) =>
                a.country.localeCompare(b.country) || a.city.localeCompare(b.city)
            );

            saveCountries(newCountries);
            saveCities(newCities);
        }

        // ================================================================
        //  云端同步函数
        // ================================================================
        async function syncToCloud() {
            if (!syncStatus) return;
            syncStatus.textContent = '⏳ 正在同步云端...';
            syncStatus.className = 'sync-status syncing';

            try {
                // 1. 获取现有记录，识别特殊记录（国家和城市）
                const listRes = await fetch(DATABASE_URL, {
                    headers: { 'x-apikey': API_KEY, 'Content-Type': 'application/json' }
                });
                if (!listRes.ok) throw new Error('读取云端列表失败');
                const existing = await listRes.json();

                // 分离特殊记录和照片记录
                const specialIds = [];
                const photoIds = [];
                existing.forEach(rec => {
                    if (rec.type === 'countries' || rec.type === 'cities') {
                        specialIds.push({ _id: rec._id, type: rec.type });
                    } else {
                        photoIds.push(rec._id);
                    }
                });

                // 删除所有照片记录
                for (const id of photoIds) {
                    await fetch(`${DATABASE_URL}/${id}`, {
                        method: 'DELETE',
                        headers: { 'x-apikey': API_KEY }
                    });
                }

                // 2. 更新国家记录（如果存在则更新，否则创建）
                const countriesList = loadCountries();
                const citiesList = loadCities();
                let countryRec = specialIds.find(s => s.type === 'countries');
                if (countryRec) {
                    await fetch(`${DATABASE_URL}/${countryRec._id}`, {
                        method: 'PUT',
                        headers: {
                            'x-apikey': API_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ type: 'countries', list: countriesList })
                    });
                } else {
                    await fetch(DATABASE_URL, {
                        method: 'POST',
                        headers: {
                            'x-apikey': API_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ type: 'countries', list: countriesList })
                    });
                }

                let cityRec = specialIds.find(s => s.type === 'cities');
                if (cityRec) {
                    await fetch(`${DATABASE_URL}/${cityRec._id}`, {
                        method: 'PUT',
                        headers: {
                            'x-apikey': API_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ type: 'cities', list: citiesList })
                    });
                } else {
                    await fetch(DATABASE_URL, {
                        method: 'POST',
                        headers: {
                            'x-apikey': API_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ type: 'cities', list: citiesList })
                    });
                }

                // 3. 批量插入照片（每次最多10条）
                const photos = loadPhotos();
                const photoData = photos.map(p => ({
                    type: 'photo',
                    id: p.id,
                    title: p.title,
                    country: p.country,
                    city: p.city,
                    image: p.image
                }));

                const batchSize = 10;
                for (let i = 0; i < photoData.length; i += batchSize) {
                    const batch = photoData.slice(i, i + batchSize);
                    const resp = await fetch(DATABASE_URL, {
                        method: 'POST',
                        headers: {
                            'x-apikey': API_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(batch)
                    });
                    if (!resp.ok) {
                        const err = await resp.text();
                        throw new Error(`批量插入失败 (${resp.status}): ${err}`);
                    }
                    await new Promise(resolve => setTimeout(resolve, 300)); // 限流
                }

                syncStatus.textContent = '✅ 已同步到云端';
                syncStatus.className = 'sync-status success';
            } catch (error) {
                console.warn('云端同步失败', error);
                syncStatus.textContent = '⚠️ 云端同步失败，数据仅保存在本地';
                syncStatus.className = 'sync-status error';
            }
        }

        // ---- 从云端加载（初始化时调用） ----
        async function loadFromCloud() {
            if (!syncStatus) return;
            syncStatus.textContent = '⏳ 正在从云端加载...';
            syncStatus.className = 'sync-status syncing';

            try {
                const res = await fetch(DATABASE_URL, {
                    headers: { 'x-apikey': API_KEY, 'Content-Type': 'application/json' }
                });
                if (!res.ok) throw new Error('读取云端失败');
                const data = await res.json();

                // 分离特殊记录和照片
                let countriesList = [];
                let citiesList = [];
                const photosFromCloud = [];

                data.forEach(rec => {
                    if (rec.type === 'countries') {
                        countriesList = rec.list || [];
                    } else if (rec.type === 'cities') {
                        citiesList = rec.list || [];
                    } else if (rec.type === 'photo' && rec.id && rec.image) {
                        photosFromCloud.push({
                            id: rec.id,
                            title: rec.title || '',
                            country: rec.country || '',
                            city: rec.city || '',
                            image: rec.image
                        });
                    }
                });

                if (photosFromCloud.length > 0) {
                    // 用云端数据覆盖本地
                    savePhotos(photosFromCloud);
                    if (countriesList.length) saveCountries(countriesList);
                    if (citiesList.length) saveCities(citiesList);
                    syncStatus.textContent = '✅ 已从云端同步';
                    syncStatus.className = 'sync-status success';
                    return true;
                } else {
                    // 云端无照片，将本地默认数据同步上去
                    await syncToCloud();
                    syncStatus.textContent = '✅ 已从云端同步';
                    syncStatus.className = 'sync-status success';
                    return true;
                }
            } catch (error) {
                console.warn('云端加载失败，使用本地数据', error);
                syncStatus.textContent = '⚠️ 云端加载失败，使用本地数据';
                syncStatus.className = 'sync-status error';
                return false;
            }
        }

        // ---- 工具函数 ----
        function getCities(photos) {
            const set = new Set();
            photos.forEach(p => set.add(p.city));
            return Array.from(set).sort();
        }

        function getPhotosByCity(city) {
            if (city === 'all') return photos;
            return photos.filter(p => p.city === city);
        }

        function getPhotoById(id) {
            return photos.find(p => p.id === id);
        }

        // ---- 渲染城市按钮 ----
        function renderCityButtons() {
            const cities = getCities(photos);
            const allBtn = cityFilter.querySelector('.all-btn');
            if (!allBtn) return;
            cityFilter.querySelectorAll('.city-btn:not(.all-btn)').forEach(btn => btn.remove());

            cities.forEach(city => {
                const btn = document.createElement('button');
                btn.className = 'city-btn';
                btn.dataset.city = city;
                btn.textContent = city;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = city;
                    renderGallery(city);
                });
                cityFilter.appendChild(btn);
            });

            const newAllBtn = allBtn.cloneNode(true);
            allBtn.parentNode.replaceChild(newAllBtn, allBtn);
            newAllBtn.addEventListener('click', function() {
                document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = 'all';
                renderGallery('all');
            });
            document.querySelectorAll('.city-btn').forEach(b => b.classList.remove('active'));
            const targetBtn = document.querySelector(`.city-btn[data-city="${currentFilter}"]`) || newAllBtn;
            targetBtn.classList.add('active');
        }

        // ---- 渲染网格 ----
        function renderGallery(city, searchTerm = '') {
            let filtered = getPhotosByCity(city);
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(p =>
                    p.city.toLowerCase().includes(term) ||
                    p.country.toLowerCase().includes(term)
                );
            }

            if (filtered.length === 0) {
                gallery.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>没有找到匹配的照片<br /><span style="font-size:14px;color:#555;">试试其他关键词</span></p>
                    </div>
                `;
                return;
            }

            let html = '';
            filtered.forEach((p, index) => {
                html += `
                    <div class="photo-card" data-id="${p.id}" data-city="${p.city}" data-index="${index}">
                        <img src="${p.image}" alt="${p.title}" loading="lazy" />
                        <div class="card-overlay">
                            <span class="photo-title">${p.title}</span>
                            <span class="photo-city"><i class="fas fa-map-pin" style="font-size:11px;margin-right:4px;"></i>${p.city}</span>
                        </div>
                    </div>
                `;
            });

            document.querySelectorAll('.photo-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    openModal(id);
                });
            });

            if (city === 'all' && !searchTerm && !window._highlighted) {
                window._highlighted = true;
                setTimeout(randomHighlightAndScroll, 300);
            } else {
                if (city !== 'all' || searchTerm) window._highlighted = false;
            }
        }

        // ---- 随机高亮 ----
        function randomHighlightAndScroll() {
            const cards = document.querySelectorAll('.photo-card');
            if (cards.length === 0) return;
            cards.forEach(c => c.classList.remove('highlight'));

            const randomIndex = Math.floor(Math.random() * cards.length);
            const target = cards[randomIndex];
            if (!target) return;

            target.classList.add('highlight');
            const rect = target.getBoundingClientRect();
            const offset = rect.top + window.pageYOffset - 120;
            window.scrollTo({ top: offset, behavior: 'smooth' });

            setTimeout(() => {
                target.classList.remove('highlight');
            }, 3800);
        }

        // ---- 照片增删改 ----
        function addPhoto(title, country, city, imageData) {
            const newPhoto = {
                id: nextId(photos),
                title: title.trim(),
                country: country.trim(),
                city: city.trim(),
                image: imageData
            };
            photos.push(newPhoto);
            savePhotos(photos);
            syncCategories();
            refreshAll();
            // 异步同步到云端
            syncToCloud();
        }

        function updatePhoto(id, title, country, city, imageData) {
            const idx = photos.findIndex(p => p.id === id);
            if (idx === -1) return;
            const updated = { ...photos[idx] };
            if (title) updated.title = title.trim();
            if (country) updated.country = country.trim();
            if (city) updated.city = city.trim();
            if (imageData) updated.image = imageData;
            photos[idx] = updated;
            savePhotos(photos);
            syncCategories();
            refreshAll();
            syncToCloud();
        }

        function deletePhoto(id) {
            photos = photos.filter(p => p.id !== id);
            savePhotos(photos);
            syncCategories();
            refreshAll();
            if (currentPhotoId === id) closeModal();
            syncToCloud();
        }

        function resetToDefault() {
            if (confirm('将恢复默认示例照片，当前数据将被覆盖，确定吗？')) {
                photos = DEFAULT_PHOTOS.slice();
                savePhotos(photos);
                syncCategories();
                refreshAll();
                closeModal();
                syncToCloud();
            }
        }

        function nextId(photos) {
            if (!photos.length) return 1;
            const maxId = Math.max(...photos.map(p => p.id));
            return maxId + 1;
        }

        // ---- 编辑表单 ----

        function openEditForm(id) {
            if (!isAuthorized) return;
            editingId = id;
            const photo = getPhotoById(id);
            if (!photo) return;

            formTitle.value = photo.title;
            formFile.value = '';

        function closeEditForm() {
            editForm.classList.remove('show');
            editingId = null;
            formFile.value = '';
            formTitle.value = '';
            formCountry.value = '';
            formCity.innerHTML = `<option value="">— 请先选择国家 —</option>`;

        function saveForm() {
            if (!isAuthorized) return;
            const title = formTitle.value.trim();
            const country = formCountry.value;
            const city = formCity.value;
            if (!title || !country || !city) {
                alert('标题、国家和城市都不能为空');
                return;
            }

            const file = formFile.files[0];
            if (file) {
                compressImage(file, 800, 0.8, (base64) => {
                    if (editingId) {
                        updatePhoto(editingId, title, country, city, base64);
                    } else {
                        addPhoto(title, country, city, base64);
                    }
                    closeEditForm();
                });
            } else {
                if (editingId) {
                    updatePhoto(editingId, title, country, city, null);
                } else {
                    alert('请选择一张照片');
                    return;
                }
                closeEditForm();
            }
        }

        function compressImage(file, maxW, quality, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width,
                        h = img.height;
                    if (w > maxW) {
                        const ratio = maxW / w;
                        w = maxW;
                        h = h * ratio;
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
