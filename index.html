<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kk's Photography</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== 全局重置 & 白色基调 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            padding-top: 72px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 0 40px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #1a1a1a;
        }
        .navbar .logo span {
            color: #d4a574;
        }

        .navbar .nav-links {
            display: flex;
            gap: 32px;
            font-size: 16px;
            font-weight: 500;
        }
        .navbar .nav-links a {
            color: #555;
            transition: color 0.2s;
            cursor: pointer;
        }
        .navbar .nav-links a:hover,
        .navbar .nav-links a.active {
            color: #1a1a1a;
        }
        .navbar .nav-links a.active {
            border-bottom: 2px solid #d4a574;
            padding-bottom: 4px;
        }

        .admin-toggle {
            background: none;
            border: none;
            font-size: 20px;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
            padding: 8px;
        }
        .admin-toggle:hover {
            color: #1a1a1a;
        }

        /* ========== 页面容器 ========== */
        .page {
            display: none;
            padding: 40px 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .page.active {
            display: block;
        }

        /* ========== 首页（HOME） ========== */
        .home-hero {
            text-align: center;
            padding: 60px 0 40px;
        }
        .home-hero h1 {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #1a1a1a;
        }
        .home-hero h1 span {
            color: #d4a574;
            font-weight: 600;
        }
        .home-hero .sub {
            font-size: 18px;
            color: #888;
            margin-top: 12px;
        }
        .home-hero .enter-btn {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 48px;
            border: 1px solid #1a1a1a;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            background: transparent;
            cursor: pointer;
            transition: all 0.25s;
        }
        .home-hero .enter-btn:hover {
            background: #1a1a1a;
            color: #fff;
        }

        /* 轮播 */
        .carousel {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 40px auto 0;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #f5f5f5;
        }
        .carousel .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
        }
        .carousel .slide {
            flex: 0 0 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .carousel .dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        .carousel .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: background 0.3s;
        }
        .carousel .dots span.active {
            background: #fff;
        }

        /* ========== 作品页（WORKS） ========== */
        .works-header {
            margin-bottom: 32px;
        }
        .works-header h2 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .filter-section {
            margin: 20px 0 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filter-section .filter-label {
            font-size: 14px;
            color: #888;
            margin-right: 8px;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .filter-btn:hover {
            border-color: #999;
            color: #1a1a1a;
        }
        .filter-btn.active {
            background: #d4a574;
            border-color: #d4a574;
            color: #fff;
        }
        .filter-btn.city-btn {
            background: #f0f0f0;
            border-color: #e0e0e0;
        }
        .filter-btn.city-btn.active {
            background: #d4a574;
            border-color: #d4a574;
            color: #fff;
        }
        .filter-back {
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 12px;
            font-family: inherit;
        }
        .filter-back:hover {
            color: #1a1a1a;
        }

        /* 照片网格（两列） */
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }
        .photo-grid .grid-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #f5f5f5;
            aspect-ratio: 4 / 3;
            cursor: pointer;
            transition: transform 0.25s ease;
        }
        .photo-grid .grid-item:hover {
            transform: scale(1.01);
        }
        .photo-grid .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-grid .grid-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 18px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
            color: #fff;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .photo-grid .grid-item:hover .overlay {
            opacity: 1;
        }
        .photo-grid .grid-item .overlay .title {
            font-size: 16px;
            font-weight: 500;
        }
        .photo-grid .grid-item .overlay .city {
            font-size: 13px;
            opacity: 0.8;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
            font-size: 18px;
        }

        /* ========== 模态框（照片详情） ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 1000px;
            width: 100%;
            max-height: 95vh;
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-image-wrap {
            width: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 0;
        }
        .modal-image-wrap img {
            width: 100%;
            max-height: 90vh;
            object-fit: contain;
            display: block;
        }

        .modal-footer {
            padding: 20px 28px 24px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            flex-shrink: 0;
        }
        .modal-footer .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .modal-footer .info .title {
            font-size: 20px;
            font-weight: 500;
            color: #1a1a1a;
        }
        .modal-footer .info .city {
            font-size: 14px;
            color: #888;
        }
        .modal-footer .actions {
            display: flex;
            gap: 12px;
        }
        .modal-footer .actions .printer-btn {
            background: #f0f0f0;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .modal-footer .actions .printer-btn:hover {
            background: #e0e0e0;
        }

        /* ========== 拍立得全屏覆盖 ========== */
        .polaroid-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3000;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .polaroid-fullscreen.active {
            display: flex;
        }

        .polaroid-fullscreen .polaroid-frame {
            background: #f5f2ed;
            padding: 30px 30px 70px 30px;
            border-radius: 8px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            max-width: 600px;
            width: 100%;
            transform: rotate(0.8deg);
            animation: polaroidIn 0.5s ease;
        }
        @keyframes polaroidIn {
            from {
                opacity: 0;
                transform: scale(0.9) rotate(-3deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0.8deg);
            }
        }

        .polaroid-fullscreen .polaroid-frame .polaroid-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 4px;
            background: #111;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption {
            text-align: center;
            margin-top: 18px;
            font-family: 'Courier New', Georgia, serif;
            font-size: 17px;
            color: #2d2d2d;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption .p-title {
            font-weight: 600;
            font-size: 20px;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption .p-city {
            color: #8a7a6a;
            font-size: 15px;
        }

        .polaroid-fullscreen .polaroid-close {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .polaroid-fullscreen .polaroid-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ========== About 页 ========== */
        .about-content {
            max-width: 720px;
            margin: 40px auto;
            text-align: center;
            font-size: 18px;
            line-height: 1.8;
            color: #444;
        }
        .about-content h2 {
            font-weight: 300;
            font-size: 32px;
            margin-bottom: 20px;
        }

        /* ========== 管理面板（深色） ========== */
        .admin-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 560px;
            height: 100vh;
            background: #141414;
            z-index: 4000;
            padding: 24px 24px 30px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: -8px 0 48px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
            color: #eee;
        }
        .admin-panel.open {
            right: 0;
        }

        .admin-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .admin-panel .panel-header h2 {
            font-size: 22px;
            font-weight: 500;
            color: #fff;
        }
        .admin-panel .panel-header h2 i {
            color: #d4a574;
            margin-right: 8px;
        }
        .admin-panel .panel-close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }
        .admin-panel .panel-close:hover {
            color: #fff;
        }

        .admin-panel .admin-auth {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
        }
        .admin-panel .admin-auth .auth-icon {
            font-size: 48px;
            color: #d4a574;
        }
        .admin-panel .admin-auth .auth-title {
            font-size: 18px;
            color: #ddd;
        }
        .admin-panel .admin-auth .auth-input-group {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .admin-panel .admin-auth .auth-input-group input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: #0e0e0e;
            color: #f0f0f0;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            min-width: 180px;
        }
        .admin-panel .admin-auth .auth-input-group input:focus {
            border-color: #d4a574;
        }
        .admin-panel .admin-auth .auth-input-group button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: #d4a574;
            color: #0e0e0e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .admin-panel .admin-auth .auth-error {
            color: #e05a5a;
            font-size: 14px;
            min-height: 20px;
        }

        .admin-panel .admin-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            flex: 1;
        }
        .admin-panel .admin-content.visible {
            display: flex;
        }

        .admin-panel .sync-status {
            font-size: 13px;
            color: #6fcf97;
            padding: 4px 0;
            text-align: center;
        }

        .admin-panel .edit-form {
            background: #1a1a1a;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
            flex-direction: column;
            gap: 14px;
            flex-shrink: 0;
        }
        .admin-panel .edit-form.show {
            display: flex;
        }

        .admin-panel .edit-form .form-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .admin-panel .edit-form .form-row label {
            font-size: 13px;
            color: #aaa;
            font-weight: 500;
        }
        .admin-panel .edit-form .form-row input,
        .admin-panel .edit-form .form-row select {
            background: #0e0e0e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f0f0f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .admin-panel .edit-form .form-row input:focus,
        .admin-panel .edit-form .form-row select:focus {
            border-color: #d4a574;
        }
        .admin-panel .edit-form .form-row input[type="file"] {
            padding: 8px;
            background: transparent;
        }

        .admin-panel .edit-form .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .admin-panel .edit-form .form-actions button {
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .admin-panel .edit-form .form-actions .save-btn {
            background: #d4a574;
            color: #0e0e0e;
        }
        .admin-panel .edit-form .form-actions .save-btn:hover {
            background: #e0b88a;
        }
        .admin-panel .edit-form .form-actions .cancel-btn {
            background: rgba(255, 255, 255, 0.06);
            color: #aaa;
        }
        .admin-panel .edit-form .form-actions .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .admin-panel .photo-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
            max-height: 300px;
        }
        .admin-panel .photo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1e1e1e;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .admin-panel .photo-item .thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #111;
            flex-shrink: 0;
        }
        .admin-panel .photo-item .info {
            flex: 1;
            min-width: 0;
        }
        .admin-panel .photo-item .info .item-title {
            font-weight: 500;
            font-size: 15px;
            color: #eee;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .admin-panel .photo-item .info .item-city {
            font-size: 13px;
            color: #d4a574;
        }
        .admin-panel .photo-item .actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .admin-panel .photo-item .actions button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #aaa;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .admin-panel .photo-item .actions .edit-btn:hover {
            border-color: #d4a574;
            color: #d4a574;
            background: rgba(212, 165, 116, 0.08);
        }
        .admin-panel .photo-item .actions .del-btn:hover {
            border-color: #e05a5a;
            color: #e05a5a;
            background: rgba(224, 90, 90, 0.08);
        }

        .admin-panel .category-section {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 14px;
            flex-shrink: 0;
        }
        .admin-panel .category-section h3 {
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 10px;
        }
        .admin-panel .category-section .cat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .admin-panel .category-section .cat-item .cat-name {
            color: #ddd;
            font-size: 14px;
        }
        .admin-panel .category-section .cat-item .cat-count {
            color: #888;
            font-size: 12px;
            margin-left: 8px;
        }
        .admin-panel .category-section .cat-item .del-cat-btn {
            background: transparent;
            border: none;
            color: #e05a5a;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .admin-panel .category-section .cat-item .del-cat-btn:hover {
            background: rgba(224, 90, 90, 0.15);
            color: #ff7a7a;
        }

        .admin-panel .category-section .add-cat-form {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .admin-panel .category-section .add-cat-form input,
        .admin-panel .category-section .add-cat-form select {
            background: #0e0e0e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 14px;
            color: #f0f0f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            flex: 1;
            min-width: 100px;
        }
        .admin-panel .category-section .add-cat-form button {
            background: rgba(212, 165, 116, 0.15);
            border: 1px solid rgba(212, 165, 116, 0.2);
            color: #d4a574;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            white-space: nowrap;
        }
        .admin-panel .category-section .add-cat-form button:hover {
            background: rgba(212, 165, 116, 0.25);
            border-color: #d4a574;
        }

        .admin-panel .panel-footer {
            flex-shrink: 0;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-panel .panel-footer button {

    <!-- ========== 模态框（照片详情） ========== -->

    <!-- ========== 管理面板 ========== -->
    <div class="admin-panel" id="adminPanel">
        <div class="panel-header">
            <h2><i class="fas fa-lock"></i> 管理面板</h2>

        <div class="admin-auth" id="adminAuth">

            <div class="edit-form" id="editForm">

                    <label>照片文件（选图自动上传到 Cloudinary）</label>

                <h3><i class="fas fa-flag"></i> 国家管理</h3>
                <div id="countryListAdmin"></div>
                <div class="add-cat-form">

                    <button id="addCountryBtn">添加国家</button>

            </div>
            <div class="category-section">
                <h3><i class="fas fa-city"></i> 城市管理</h3>
                <div id="cityListAdmin"></div>
                <div class="add-cat-form">
                    <select id="cityCountrySelect"><option value="">— 选择国家 —</option></select>
                    <input type="text" id="newCityInput" placeholder="输入城市名称">

    <script>
        // ================================================================
        //  示例数据（模拟云端照片库）
        // ================================================================
        const DEFAULT_PHOTOS = [{
            id: 1,
            title: '城市晨曦',
            country: '中国',
            city: '上海',
            image: 'https://picsum.photos/seed/shanghai1/800/600'
        }, {
            id: 2,
            title: '老街光影',
            country: '中国',
            city: '北京',
            image: 'https://picsum.photos/seed/beijing1/800/600'
        }, {
            id: 3,
            title: '河畔黄昏',
            country: '法国',
            city: '巴黎',
            image: 'https://picsum.photos/seed/paris1/800/600'
        }, {
            id: 4,
            title: '雨中即景',
            country: '日本',
            city: '东京',
            image: 'https://picsum.photos/seed/tokyo1/800/600'
        }, {
            id: 5,
            title: '广场鸽子',
            country: '意大利',
            city: '罗马',
            image: 'https://picsum.photos/seed/rome1/800/600'
        }, {
            id: 6,
            title: '海岸落日',
            country: '美国',
            city: '洛杉矶',
            image: 'https://picsum.photos/seed/la1/800/600'
        }];

        // ================================================================
        //  状态管理
        // ================================================================
        let photos = [];
        let currentPage = 'home';
        let currentFilter = 'all'; // 'all' 或国家名
        let currentCityFilter = 'all'; // 'all' 或城市名
        let editingId = null;
        let carouselIndex = 0;
        let carouselInterval = null;

        // ================================================================
        //  DOM 引用
        // ================================================================
        const $ = (id) => document.getElementById(id);
        const pageHome = $('page-home');
        const pageWorks = $('page-works');
        const pageAbout = $('page-about');
        const navLinks = document.querySelectorAll('.nav-links a');
        const photoGrid = $('photoGrid');
        const filterSection = $('filterSection');
        const carouselSlides = $('carouselSlides');
        const carouselDots = $('carouselDots');
        const modalOverlay = $('photoModal');
        const modalImage = $('modalImage');
        const modalTitle = $('modalTitle');
        const modalCity = $('modalCity');
        const modalClose = $('modalClose');
        const modalPrinterBtn = $('modalPrinterBtn');
        const polaroidOverlay = $('polaroidFullscreen');
        const polaroidImg = $('polaroidImg');
        const polaroidTitle = $('polaroidTitle');
        const polaroidCity = $('polaroidCity');
        const polaroidClose = $('polaroidClose');
        const adminToggle = $('adminToggle');
        const adminPanel = $('adminPanel');
        const adminClose = $('adminClose');
        const adminAuth = $('adminAuth');
        const adminContent = $('adminContent');
        const authPassword = $('authPassword');
        const authSubmitBtn = $('authSubmitBtn');
        const authError = $('authError');
        const editForm = $('editForm');
        const formFile = $('formFile');
        const formImageUrl = $('formImageUrl');
        const formTitle = $('formTitle');
        const formCountry = $('formCountry');
        const formCity = $('formCity');
        const formSaveBtn = $('formSaveBtn');
        const formCancelBtn = $('formCancelBtn');
        const adminPhotoList = $('adminPhotoList');
        const countryListAdmin = $('countryListAdmin');
        const cityListAdmin = $('cityListAdmin');
        const newCountryInput = $('newCountryInput');
        const addCountryBtn = $('addCountryBtn');
        const cityCountrySelect = $('cityCountrySelect');
        const newCityInput = $('newCityInput');
        const addCityBtn = $('addCityBtn');
        const addPhotoBtn = $('addPhotoBtn');
        const resetDefaultBtn = $('resetDefaultBtn');
        const enterGalleryBtn = $('enterGallery');

        // ================================================================
        //  工具函数
        // ================================================================
        function getCountries() {
            const set = new Set();
            photos.forEach(p => set.add(p.country));
            return Array.from(set).sort();
        }

        function getCities(country) {
            const set = new Set();
            photos.filter(p => p.country === country).forEach(p => set.add(p.city));
            return Array.from(set).sort();
        }

        function getFilteredPhotos() {
            let result = photos;
            if (currentFilter !== 'all') {
                result = result.filter(p => p.country === currentFilter);
            }
            if (currentCityFilter !== 'all') {
                result = result.filter(p => p.city === currentCityFilter);
            }
            return result;
        }

        // ================================================================
        //  渲染函数
        // ================================================================

        // 渲染作品网格
        function renderWorks() {
            const filtered = getFilteredPhotos();
            if (filtered.length === 0) {
                photoGrid.innerHTML = `<div class="empty-state">暂无照片</div>`;
                return;
            }
            photoGrid.innerHTML = filtered.map(p => `
                <div class="grid-item" data-id="${p.id}">
                    <img src="${p.image}" alt="${p.title}" loading="lazy">
                    <div class="overlay">
                        <div class="title">${p.title}</div>
                        <div class="city">${p.country} · ${p.city}</div>
                    </div>
                </div>
            `).join('');

            // 点击打开模态框
            photoGrid.querySelectorAll('.grid-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.id);
                    const photo = photos.find(p => p.id === id);
                    if (photo) openModal(photo);
                });
            });
        }

        // 渲染筛选按钮
        function renderFilters() {
            const countries = getCountries();
            let html = `<span class="filter-label">筛选：</span>`;
            html += `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" data-filter="all">全部</button>`;
            countries.forEach(c => {
                html +=
                    `<button class="filter-btn city-btn ${currentFilter === c ? 'active' : ''}" data-filter="${c}">${c}</button>`;
            });
            // 城市筛选（仅在选择了国家后显示）
            if (currentFilter !== 'all') {
                const cities = getCities(currentFilter);
                html += `<span class="filter-label" style="margin-left:12px;">城市：</span>`;
                html +=
                    `<button class="filter-btn ${currentCityFilter === 'all' ? 'active' : ''}" data-city="all">全部</button>`;
                cities.forEach(c => {
                    html +=
                        `<button class="filter-btn city-btn ${currentCityFilter === c ? 'active' : ''}" data-city="${c}">${c}</button>`;
                });
            }
            filterSection.innerHTML = html;

            // 绑定筛选事件
            filterSection.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentFilter = btn.dataset.filter;
                    currentCityFilter = 'all';
                    renderFilters();
                    renderWorks();
                });
            });
            filterSection.querySelectorAll('.filter-btn[data-city]').forEach(btn => {
                btn.addEventListener('click', () => {
                    currentCityFilter = btn.dataset.city;
                    renderFilters();
                    renderWorks();
                });
            });
        }

        // 渲染轮播
        function renderCarousel() {
            const items = photos.length > 0 ? photos : DEFAULT_PHOTOS;
            carouselSlides.innerHTML = items.map(p => `
                <div class="slide">
                    <img src="${p.image}" alt="${p.title}" loading="lazy">
                </div>
            `).join('');

            carouselDots.innerHTML = items.map((_, i) => `
                <span class="${i === 0 ? 'active' : ''}" data-index="${i}"></span>
            `).join('');

            carouselDots.querySelectorAll('span').forEach(dot => {
                dot.addEventListener('click', () => {
                    const idx = parseInt(dot.dataset.index);
                    goToSlide(idx);
                });
            });

            // 自动轮播
            if (carouselInterval) clearInterval(carouselInterval);
            if (items.length > 1) {
                carouselInterval = setInterval(() => {
                    goToSlide((carouselIndex + 1) % items.length);
                }, 4000);
            }
            carouselIndex = 0;
            updateCarousel();
        }

        function goToSlide(index) {
            const items = photos.length > 0 ? photos : DEFAULT_PHOTOS;
            if (index >= items.length) index = 0;
            if (index < 0) index = items.length - 1;
            carouselIndex = index;
            updateCarousel();
        }

        function updateCarousel() {
            const items = photos.length > 0 ? photos : DEFAULT_PHOTOS;
            const offset = -carouselIndex * 100;
            carouselSlides.style.transform = `translateX(${offset}%)`;
            carouselDots.querySelectorAll('span').forEach((dot, i) => {
                dot.classList.toggle('active', i === carouselIndex);
            });
        }

        // 模态框
        function openModal(photo) {
            modalImage.src = photo.image;
            modalTitle.textContent = photo.title;
            modalCity.textContent = `${photo.country} · ${photo.city}`;
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            // 存储当前照片供拍立得使用
            modalOverlay.dataset.photoId = photo.id;
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 拍立得
        function openPolaroid(photo) {
            polaroidImg.src = photo.image;
            polaroidTitle.textContent = photo.title;
            polaroidCity.textContent = `${photo.country} · ${photo.city}`;
            polaroidOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closePolaroid() {
            polaroidOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // 管理面板 - 渲染照片列表
        function renderAdminPhotoList() {
            if (photos.length === 0) {
                adminPhotoList.innerHTML = `<div style="color:#888;text-align:center;padding:20px;">暂无照片</div>`;
                return;
            }
            adminPhotoList.innerHTML = photos.map(p => `
                <div class="photo-item" data-id="${p.id}">
                    <img class="thumb" src="${p.image}" alt="${p.title}">
                    <div class="info">
                        <div class="item-title">${p.title}</div>
                        <div class="item-city">${p.country} · ${p.city}</div>
                    </div>
                    <div class="actions">
                        <button class="edit-btn" data-id="${p.id}">编辑</button>
                        <button class="del-btn" data-id="${p.id}">删除</button>
                    </div>
                </div>
            `).join('');

            adminPhotoList.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    startEdit(id);
                });
            });
            adminPhotoList.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    if (confirm('确定要删除这张照片吗？')) {
                        photos = photos.filter(p => p.id !== id);
                        saveData();
                        renderAll();
                    }
                });
            });
        }

        // 管理面板 - 渲染国家/城市列表
        function renderAdminCategories() {
            const countries = getCountries();
            // 国家列表
            countryListAdmin.innerHTML = countries.map(c => `
                <div class="cat-item">
                    <span class="cat-name">${c} <span class="cat-count">(${photos.filter(p => p.country === c).length})</span></span>
                    <button class="del-cat-btn" data-country="${c}">删除</button>
                </div>
            `).join('');

            countryListAdmin.querySelectorAll('.del-cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const country = btn.dataset.country;
                    if (confirm(`确定要删除国家 "${country}" 及其所有照片吗？`)) {
                        photos = photos.filter(p => p.country !== country);
                        saveData();
                        renderAll();
                    }
                });
            });

            // 城市列表（按国家分组）
            const allCities = [];
            countries.forEach(c => {
                getCities(c).forEach(city => {
                    allCities.push({ country: c, city });
                });
            });
            cityListAdmin.innerHTML = allCities.map(({ country, city }) => `
                <div class="cat-item">
                    <span class="cat-name">${city} <span class="cat-count">(${country})</span></span>
                    <button class="del-cat-btn" data-country="${country}" data-city="${city}">删除</button>
                </div>
            `).join('');

            cityListAdmin.querySelectorAll('.del-cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const country = btn.dataset.country;
                    const city = btn.dataset.city;
                    if (confirm(`确定要删除城市 "${city}" 及其所有照片吗？`)) {
                        photos = photos.filter(p => !(p.country === country && p.city === city));
                        saveData();
                        renderAll();
                    }
                });
            });

            // 更新下拉框
            updateCountrySelects();
        }

        function updateCountrySelects() {
            const countries = getCountries();
            // 表单国家下拉
            const currentCountry = formCountry.value;
            formCountry.innerHTML = `<option value="">— 选择国家 —</option>` +
                countries.map(c => `<option value="${c}" ${c === currentCountry ? 'selected' : ''}>${c}</option>`).join('');

            // 城市管理 - 国家下拉
            const currentSel = cityCountrySelect.value;
            cityCountrySelect.innerHTML = `<option value="">— 选择国家 —</option>` +
                countries.map(c => `<option value="${c}" ${c === currentSel ? 'selected' : ''}>${c}</option>`).join('');

            // 表单城市下拉（根据选中的国家）
            const selectedCountry = formCountry.value;
            const cities = selectedCountry ? getCities(selectedCountry) : [];
            const currentCity = formCity.value;
            formCity.innerHTML = `<option value="">— ${selectedCountry ? '选择城市' : '请先选择国家'} —</option>` +
                cities.map(c => `<option value="${c}" ${c === currentCity ? 'selected' : ''}>${c}</option>`).join('');
        }

        // 开始编辑
        function startEdit(id) {
            const photo = photos.find(p => p.id === id);
            if (!photo) return;
            editingId = id;
            formTitle.value = photo.title || '';
            formCountry.value = photo.country || '';
            formCity.value = photo.city || '';
            formImageUrl.value = photo.image || '';
            formFile.value = '';
            updateCountrySelects();
            editForm.classList.add('show');
            editForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // 保存编辑/新增
        function savePhoto() {
            const title = formTitle.value.trim() || '未命名';
            const country = formCountry.value;
            const city = formCity.value;
            const imageUrl = formImageUrl.value.trim();

            if (!country || !city) {
                alert('请选择国家和城市');
                return;
            }

            let image = imageUrl;
            // 如果有上传文件，使用占位图（实际项目中会上传）
            if (formFile.files && formFile.files.length > 0) {
                // 模拟上传：使用本地预览 URL
                const file = formFile.files[0];
                image = URL.createObjectURL(file);
                // 注意：实际项目中应该上传到 Cloudinary 等云存储
                // 这里为了演示，使用 object URL
            }

            if (!image) {
                alert('请提供图片链接或上传文件');
                return;
            }

            if (editingId !== null) {
                // 编辑
                const idx = photos.findIndex(p => p.id === editingId);
                if (idx !== -1) {
                    photos[idx] = { ...photos[idx], title, country, city, image };
                }
            } else {
                // 新增
                const newId = Date.now();
                photos.push({ id: newId, title, country, city, image });
            }

            editingId = null;
            saveData();
            renderAll();
            editForm.classList.remove('show');
            formFile.value = '';
            formImageUrl.value = '';
            formTitle.value = '';
            formCountry.value = '';
            formCity.value = '';
        }

        // 取消编辑
        function cancelEdit() {
            editingId = null;
            editForm.classList.remove('show');
            formFile.value = '';
            formImageUrl.value = '';
            formTitle.value = '';
            formCountry.value = '';
            formCity.value = '';
        }

        // 恢复默认
        function resetDefault() {
            if (confirm('将恢复默认示例照片，当前数据将丢失！')) {
                photos = JSON.parse(JSON.stringify(DEFAULT_PHOTOS));
                saveData();
                renderAll();
                cancelEdit();
            }
        }

        // ================================================================
        //  数据持久化 (localStorage)
        // ================================================================
        function saveData() {
            localStorage.setItem('kk_photos_data', JSON.stringify(photos));
        }

        function loadData() {
            const stored = localStorage.getItem('kk_photos_data');
            if (stored) {
                try {
                    photos = JSON.parse(stored);
                    return true;
                } catch (e) {
                    console.warn('数据解析失败，使用默认数据');
                }
            }
            return false;
        }

        // ================================================================
        //  渲染所有
        // ================================================================
        function renderAll() {
            renderFilters();
            renderWorks();
            renderCarousel();
            renderAdminPhotoList();
            renderAdminCategories();
            // 更新同步状态
            const syncStatus = $('syncStatus');
            if (syncStatus) {
                syncStatus.textContent = `✅ 已加载 ${photos.length} 张照片 (本地存储)`;
                syncStatus.style.color = '#6fcf97';
            }
        }

        // ================================================================
        //  页面切换
        // ================================================================
        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            navLinks.forEach(el => el.classList.remove('active'));

            if (page === 'home') {
                pageHome.classList.add('active');
                navLinks[0].classList.add('active');
                // 重新启动轮播
                renderCarousel();
            } else if (page === 'works') {
                pageWorks.classList.add('active');
                navLinks[1].classList.add('active');
                renderFilters();
                renderWorks();
            } else if (page === 'about') {
                pageAbout.classList.add('active');
                navLinks[2].classList.add('active');
            }
        }

        // ================================================================
        //  管理面板认证
        // ================================================================
        const ADMIN_PASSWORD = 'kst2142600396';

        function handleAuth() {
            const pwd = authPassword.value;
            if (pwd === ADMIN_PASSWORD) {
                adminAuth.style.display = 'none';
                adminContent.classList.add('visible');
                authError.textContent = '';
                renderAdminPhotoList();
                renderAdminCategories();
                updateCountrySelects();
            } else {
                authError.textContent = '密码错误，请重试';
                authPassword.value = '';
                authPassword.focus();
            }
        }

        // ================================================================
        //  事件绑定
        // ================================================================

        // 导航切换
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                const page = link.dataset.page;
                switchPage(page);
            });
        });

        // ENTER GALLERY 按钮 -> 跳转到 Works
        enterGalleryBtn.addEventListener('click', () => {
            switchPage('works');
        });

        // 模态框
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
                closePolaroid();
            }
        });

        // 拍立得
        modalPrinterBtn.addEventListener('click', () => {
            const photoId = parseInt(modalOverlay.dataset.photoId);
            const photo = photos.find(p => p.id === photoId);
            if (photo) {
                closeModal();
                setTimeout(() => openPolaroid(photo), 300);
            }
        });
        polaroidClose.addEventListener('click', closePolaroid);
        polaroidOverlay.addEventListener('click', (e) => {
            if (e.target === polaroidOverlay) closePolaroid();
        });

        // 管理面板
        adminToggle.addEventListener('click', () => {
            adminPanel.classList.toggle('open');
            if (adminPanel.classList.contains('open')) {
                authPassword.focus();
            }
        });
        adminClose.addEventListener('click', () => {
            adminPanel.classList.remove('open');
        });

        // 认证
        authSubmitBtn.addEventListener('click', handleAuth);
        authPassword.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleAuth();
        });

        // 表单 - 国家切换时更新城市
        formCountry.addEventListener('change', updateCountrySelects);

        // 表单 - 保存/取消
        formSaveBtn.addEventListener('click', savePhoto);
        formCancelBtn.addEventListener('click', cancelEdit);

        // 添加照片
        addPhotoBtn.addEventListener('click', () => {
            editingId = null;
            formTitle.value = '';
            formCountry.value = '';
            formCity.value = '';
            formImageUrl.value = '';
            formFile.value = '';
            updateCountrySelects();
            editForm.classList.add('show');
            editForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });

        // 恢复默认
        resetDefaultBtn.addEventListener('click', resetDefault);

        // 添加国家
        addCountryBtn.addEventListener('click', () => {
            const name = newCountryInput.value.trim();
            if (!name) { alert('请输入国家名称'); return; }
            if (getCountries().includes(name)) { alert('国家已存在'); return; }
            // 添加一个示例照片占位
            photos.push({
                id: Date.now(),
                title: `新照片 - ${name}`,
                country: name,
                city: '示例城市',
                image: 'https://picsum.photos/seed/' + Date.now() + '/800/600'
            });
            saveData();
            renderAll();
            newCountryInput.value = '';
        });

        // 添加城市
        addCityBtn.addEventListener('click', () => {
            const country = cityCountrySelect.value;
            const name = newCityInput.value.trim();
            if (!country) { alert('请选择国家'); return; }
            if (!name) { alert('请输入城市名称'); return; }
            if (getCities(country).includes(name)) { alert('城市已存在'); return; }
            photos.push({
                id: Date.now(),
                title: `新照片 - ${name}`,
                country: country,
                city: name,
                image: 'https://picsum.photos/seed/' + Date.now() + '/800/600'
            });
            saveData();
            renderAll();
            newCityInput.value = '';
        });

        // 键盘快捷键 - ESC 关闭管理面板
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && adminPanel.classList.contains('open')) {
                adminPanel.classList.remove('open');
            }
        });

        // ================================================================
        //  初始化
        // ================================================================
        // 加载数据，如果没有则使用默认
        if (!loadData()) {
            photos = JSON.parse(JSON.stringify(DEFAULT_PHOTOS));
            saveData();
        }

        renderAll();
        switchPage('home');

        // 页面可见性变化时重置轮播
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && currentPage === 'home') {
                renderCarousel();
            }
        });

        console.log('📸 kk\'s Photography 已加载');
        console.log(`📷 共 ${photos.length} 张照片`);
    </script>

</body>
</html>
