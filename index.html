<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kk's Photography</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== 全局重置 & 白色基调 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            padding-top: 72px;
        }
        a { text-decoration: none; color: inherit; }
        img { display: block; width: 100%; height: auto; }

        /* ========== 导航栏 ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 0 40px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .navbar .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #1a1a1a;
        }
        .navbar .logo span { color: #d4a574; }
        .navbar .nav-links {
            display: flex;
            gap: 32px;
            font-size: 16px;
            font-weight: 500;
        }
        .navbar .nav-links a {
            color: #555;
            transition: color 0.2s;
            cursor: pointer;
        }
        .navbar .nav-links a:hover,
        .navbar .nav-links a.active {
            color: #1a1a1a;
        }
        .navbar .nav-links a.active {
            border-bottom: 2px solid #d4a574;
            padding-bottom: 4px;
        }
        .admin-toggle {
            background: none;
            border: none;
            font-size: 20px;
            color: #888;
            cursor: pointer;
            transition: color 0.2s;
            padding: 8px;
        }
        .admin-toggle:hover { color: #1a1a1a; }

        /* ========== 页面容器 ========== */
        .page {
            display: none;
            padding: 40px 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .page.active { display: block; }

        /* ========== 首页（HOME） ========== */
        .home-hero {
            text-align: center;
            padding: 60px 0 40px;
        }
        .home-hero h1 {
            font-size: 56px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #1a1a1a;
        }
        .home-hero h1 span { color: #d4a574; font-weight: 600; }
        .home-hero .sub {
            font-size: 18px;
            color: #888;
            margin-top: 12px;
        }
        .home-hero .enter-btn {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 48px;
            border: 1px solid #1a1a1a;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            color: #1a1a1a;
            background: transparent;
            cursor: pointer;
            transition: all 0.25s;
        }
        .home-hero .enter-btn:hover {
            background: #1a1a1a;
            color: #fff;
        }

        /* 轮播 */
        .carousel {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 40px auto 0;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            background: #f5f5f5;
        }
        .carousel .slides {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease;
        }
        .carousel .slide {
            flex: 0 0 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .carousel .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .carousel .dots {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        .carousel .dots span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: background 0.3s;
        }
        .carousel .dots span.active {
            background: #fff;
        }

        /* ========== 作品页（WORKS） ========== */
        .works-header {
            margin-bottom: 32px;
        }
        .works-header h2 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        .filter-section {
            margin: 20px 0 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filter-section .filter-label {
            font-size: 14px;
            color: #888;
            margin-right: 8px;
        }
        .filter-btn {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .filter-btn:hover {
            border-color: #999;
            color: #1a1a1a;
        }
        .filter-btn.active {
            background: #d4a574;
            border-color: #d4a574;
            color: #fff;
        }
        .filter-btn.city-btn.active {
            background: #d4a574;
            border-color: #d4a574;
            color: #fff;
        }
        .filter-btn.city-btn {
            background: #f0f0f0;
            border-color: #e0e0e0;
        }
        .filter-back {
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            padding: 6px 12px;
            font-family: inherit;
        }
        .filter-back:hover { color: #1a1a1a; }

        /* 照片网格（两列） */
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }
        .photo-grid .grid-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: #f5f5f5;
            aspect-ratio: 4 / 3;
            cursor: pointer;
            transition: transform 0.25s ease;
        }
        .photo-grid .grid-item:hover {
            transform: scale(1.01);
        }
        .photo-grid .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-grid .grid-item .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 18px;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            color: #fff;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .photo-grid .grid-item:hover .overlay {
            opacity: 1;
        }
        .photo-grid .grid-item .overlay .title {
            font-size: 16px;
            font-weight: 500;
        }
        .photo-grid .grid-item .overlay .city {
            font-size: 13px;
            opacity: 0.8;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #aaa;
            font-size: 18px;
        }

        /* ========== 模态框（照片详情） ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 2000;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            position: relative;
            max-width: 1000px;
            width: 100%;
            max-height: 95vh;
            background: #fff;
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: none;
            color: #fff;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(0,0,0,0.7); }
        .modal-image-wrap {
            width: 100%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 0;
        }
        .modal-image-wrap img {
            width: 100%;
            max-height: 90vh;
            object-fit: contain;
            display: block;
        }
        .modal-footer {
            padding: 20px 28px 24px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            flex-shrink: 0;
        }
        .modal-footer .info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .modal-footer .info .title {
            font-size: 20px;
            font-weight: 500;
            color: #1a1a1a;
        }
        .modal-footer .info .city {
            font-size: 14px;
            color: #888;
        }
        .modal-footer .actions {
            display: flex;
            gap: 12px;
        }
        .modal-footer .actions .printer-btn {
            background: #f0f0f0;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .modal-footer .actions .printer-btn:hover {
            background: #e0e0e0;
        }

        /* ========== 拍立得全屏覆盖 ========== */
        .polaroid-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 3000;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(16px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        .polaroid-fullscreen.active { display: flex; }
        .polaroid-fullscreen .polaroid-frame {
            background: #f5f2ed;
            padding: 30px 30px 70px 30px;
            border-radius: 8px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            max-width: 600px;
            width: 100%;
            transform: rotate(0.8deg);
            animation: polaroidIn 0.5s ease;
        }
        @keyframes polaroidIn {
            from { opacity: 0; transform: scale(0.9) rotate(-3deg); }
            to { opacity: 1; transform: scale(1) rotate(0.8deg); }
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 4px;
            background: #111;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption {
            text-align: center;
            margin-top: 18px;
            font-family: 'Courier New', Georgia, serif;
            font-size: 17px;
            color: #2d2d2d;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption .p-title {
            font-weight: 600;
            font-size: 20px;
        }
        .polaroid-fullscreen .polaroid-frame .polaroid-caption .p-city {
            color: #8a7a6a;
            font-size: 15px;
        }
        .polaroid-fullscreen .polaroid-close {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .polaroid-fullscreen .polaroid-close:hover {
            background: rgba(255,255,255,0.2);
        }

        /* ========== About 页 ========== */
        .about-content {
            max-width: 720px;
            margin: 40px auto;
            text-align: center;
            font-size: 18px;
            line-height: 1.8;
            color: #444;
        }
        .about-content h2 {
            font-weight: 300;
            font-size: 32px;
            margin-bottom: 20px;
        }

        /* ========== 管理面板（深色） ========== */
        .admin-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 560px;
            height: 100vh;
            background: #141414;
            z-index: 4000;
            padding: 24px 24px 30px;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.22,1,0.36,1);
            box-shadow: -8px 0 48px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
            color: #eee;
        }
        .admin-panel.open { right: 0; }
        .admin-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
        }
        .admin-panel .panel-header h2 { font-size: 22px; font-weight: 500; color: #fff; }
        .admin-panel .panel-header h2 i { color: #d4a574; margin-right: 8px; }
        .admin-panel .panel-close {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }
        .admin-panel .panel-close:hover { color: #fff; }
        .admin-panel .admin-auth {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            gap: 20px;
        }
        .admin-panel .admin-auth .auth-icon { font-size: 48px; color: #d4a574; }
        .admin-panel .admin-auth .auth-title { font-size: 18px; color: #ddd; }
        .admin-panel .admin-auth .auth-input-group {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 320px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .admin-panel .admin-auth .auth-input-group input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #0e0e0e;
            color: #f0f0f0;
            font-size: 16px;
            outline: none;
            font-family: inherit;
            min-width: 180px;
        }
        .admin-panel .admin-auth .auth-input-group input:focus { border-color: #d4a574; }
        .admin-panel .admin-auth .auth-input-group button {
            padding: 12px 28px;
            border-radius: 30px;
            border: none;
            background: #d4a574;
            color: #0e0e0e;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .admin-panel .admin-auth .auth-error { color: #e05a5a; font-size: 14px; min-height: 20px; }
        .admin-panel .admin-content { display: none; flex-direction: column; gap: 16px; flex: 1; }
        .admin-panel .admin-content.visible { display: flex; }
        .admin-panel .sync-status {
            font-size: 13px;
            color: #6fcf97;
            padding: 4px 0;
            text-align: center;
        }
        .admin-panel .edit-form {
            background: #1a1a1a;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            display: none;
            flex-direction: column;
            gap: 14px;
            flex-shrink: 0;
        }
        .admin-panel .edit-form.show { display: flex; }
        .admin-panel .edit-form .form-row { display: flex; flex-direction: column; gap: 4px; }
        .admin-panel .edit-form .form-row label { font-size: 13px; color: #aaa; font-weight: 500; }
        .admin-panel .edit-form .form-row input,
        .admin-panel .edit-form .form-row select {
            background: #0e0e0e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f0f0f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .admin-panel .edit-form .form-row input:focus,
        .admin-panel .edit-form .form-row select:focus { border-color: #d4a574; }
        .admin-panel .edit-form .form-row input[type="file"] { padding: 8px; background: transparent; }
        .admin-panel .edit-form .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }
        .admin-panel .edit-form .form-actions button {
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
        }
        .admin-panel .edit-form .form-actions .save-btn { background: #d4a574; color: #0e0e0e; }
        .admin-panel .edit-form .form-actions .save-btn:hover { background: #e0b88a; }
        .admin-panel .edit-form .form-actions .cancel-btn { background: rgba(255,255,255,0.06); color: #aaa; }
        .admin-panel .edit-form .form-actions .cancel-btn:hover { background: rgba(255,255,255,0.12); }

        .admin-panel .photo-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
            max-height: 300px;
        }
        .admin-panel .photo-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1e1e1e;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .admin-panel .photo-item .thumb {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #111;
            flex-shrink: 0;
        }
        .admin-panel .photo-item .info { flex: 1; min-width: 0; }
        .admin-panel .photo-item .info .item-title { font-weight: 500; font-size: 15px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-panel .photo-item .info .item-city { font-size: 13px; color: #d4a574; }
        .admin-panel .photo-item .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .admin-panel .photo-item .actions button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: #aaa;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .admin-panel .photo-item .actions .edit-btn:hover { border-color: #d4a574; color: #d4a574; background: rgba(212,165,116,0.08); }
        .admin-panel .photo-item .actions .del-btn:hover { border-color: #e05a5a; color: #e05a5a; background: rgba(224,90,90,0.08); }

        .admin-panel .category-section {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding-top: 14px;
            flex-shrink: 0;
        }
        .admin-panel .category-section h3 { font-size: 14px; font-weight: 500; color: #aaa; margin-bottom: 10px; }
        .admin-panel .category-section .cat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .admin-panel .category-section .cat-item .cat-name { color: #ddd; font-size: 14px; }
        .admin-panel .category-section .cat-item .cat-count { color: #888; font-size: 12px; margin-left: 8px; }
        .admin-panel .category-section .cat-item .del-cat-btn {
            background: transparent;
            border: none;
            color: #e05a5a;
            font-size: 13px;
            cursor: pointer;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .admin-panel .category-section .cat-item .del-cat-btn:hover { background: rgba(224,90,90,0.15); color: #ff7a7a; }
        .admin-panel .category-section .add-cat-form {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .admin-panel .category-section .add-cat-form input,
        .admin-panel .category-section .add-cat-form select {
            background: #0e0e0e;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 8px 14px;
            color: #f0f0f0;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            flex: 1;
            min-width: 100px;
        }
        .admin-panel .category-section .add-cat-form button {
            background: rgba(212,165,116,0.15);
            border: 1px solid rgba(212,165,116,0.2);
            color: #d4a574;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            white-space: nowrap;
        }
        .admin-panel .category-section .add-cat-form button:hover { background: rgba(212,165,116,0.25); border-color: #d4a574; }
        .admin-panel .panel-footer {
            flex-shrink: 0;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-panel .panel-footer button {
            background: rgba(212,165,116,0.12);
            border: 1px solid rgba(212,165,116,0.2);
            color: #d4a574;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .admin-panel .panel-footer button:hover { background: rgba(212,165,116,0.2); border-color: #d4a574; }
        .admin-panel .panel-footer button.danger {
            background: rgba(224,90,90,0.1);
            border-color: rgba(224,90,90,0.2);
            color: #e05a5a;
        }
        .admin-panel .panel-footer button.danger:hover { background: rgba(224,90,90,0.18); }

        /* ========== 响应式 ========== */
        @media (max-width: 900px) {
            .navbar { padding: 0 20px; height: 64px; }
            body { padding-top: 64px; }
            .navbar .logo { font-size: 20px; }
            .navbar .nav-links { gap: 20px; font-size: 14px; }
            .page { padding: 20px 20px 40px; }
